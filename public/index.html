<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#820ad1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Armin Bank — conta digital com Pix, cartão, cofrinho e crédito." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<title>Armin Bank</title>
<style>
:root{--p:#820ad1;--p2:#6a07ae;--p3:#f3e8fb;--bg:#f2f1f5;--card:#fff;--tx:#1d1a22;--mu:#76707f;--ln:#e9e6ee;--gr:#0e9f6e;--gr2:#e3f6ee;--rd:#d6334f;--rd2:#fdebee;--am:#b7791f;--am2:#fff4de;--r:16px;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:disabled{opacity:.55;cursor:default}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#root{height:100%;max-width:480px;margin:0 auto;position:relative;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.04)}
@media(min-width:520px){body{background:#e4e1ea}#root{height:min(100%,900px);margin-top:max(0px,calc((100dvh - 900px)/2));overflow:hidden;border-radius:0}}

/* ---------- login ---------- */
.auth{height:100%;overflow-y:auto;background:var(--p);color:#fff;padding:calc(36px + var(--top)) 24px calc(28px + var(--bot));display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:15px}
.logo b{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;font-size:19px;letter-spacing:0}
.auth h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:44px 0 8px}
.auth>p{margin:0 0 24px;opacity:.85}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.16);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{padding:10px;border-radius:9px;font-weight:700;color:rgba(255,255,255,.85)}
.seg button.on{background:#fff;color:var(--p)}
.auth .fld label{color:rgba(255,255,255,.9)}
.auth input{background:#fff;color:var(--tx)}
.auth .btn{background:#fff;color:var(--p);margin-top:8px}
.demo{margin-top:auto;padding-top:26px;font-size:12px;opacity:.9;text-align:center}
.demo button{display:inline-block;margin:6px 4px 0;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:12px}

/* ---------- campos e botões ---------- */
.fld{margin:0 0 14px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:#5b5563;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:14px;background:#fff;outline:0;font-size:16px;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(130,10,209,.14)}
.fld textarea{min-height:88px;resize:none}
.fld small{display:block;color:var(--mu);margin-top:5px;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:999px;background:var(--p);color:#fff;font-weight:700;font-size:15.5px;padding:0 22px}
.btn:active:not(:disabled){filter:brightness(.92)}
.btn.sec{background:var(--p3);color:var(--p)}
.btn.out{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.btn.dng{background:var(--rd2);color:var(--rd)}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 16px;width:auto}
.btns{display:grid;gap:10px;margin-top:6px}
.btns.two{grid-template-columns:1fr 1fr}
.link{color:var(--p);font-weight:700;font-size:13.5px}

/* ---------- estrutura ---------- */
.app{height:100%;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(84px + var(--bot))}
.view.sub{padding-bottom:calc(24px + var(--bot))}
.hdr{background:var(--p);color:#fff;padding:calc(14px + var(--top)) 18px 22px}
.hdr.tall{padding-bottom:30px}
.hdr .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.hdr .tools{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:inherit;position:relative}
.ib:active{background:rgba(255,255,255,.15)}
.hdr h1{margin:10px 0 0;font-size:26px;letter-spacing:-.03em;line-height:1.15}
.hdr p{margin:4px 0 0;opacity:.85;font-size:13.5px}
.av{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.dot{position:absolute;top:7px;right:7px;min-width:17px;height:17px;border-radius:9px;background:#ff4d6d;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--p)}
.wrap{padding:14px 14px 0;display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(30,10,50,.04)}
.card.flush{padding:0;overflow:hidden}
.ttl{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.ttl h3{margin:0;font-size:15px}
.mu{color:var(--mu)}.sm-t{font-size:12.5px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--ln);background:#fff}
.row:last-child{border-bottom:0}
button.row:active{background:#faf8fc}
.row .ic{width:40px;height:40px;border-radius:50%;background:var(--p3);color:var(--p);display:grid;place-items:center;flex:none}
.row .ic.g{background:var(--gr2);color:var(--gr)}.row .ic.r{background:var(--rd2);color:var(--rd)}.row .ic.a{background:var(--am2);color:var(--am)}.row .ic.n{background:#efedf2;color:#5b5563}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid span{display:block;font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:right;font-weight:700;font-size:14.5px;flex:none;max-width:44%}
.row .end small{display:block;font-weight:500;font-size:11.5px;color:var(--mu)}
.in{color:var(--gr)}.out{color:var(--tx)}
.chev{color:#b4aebb;width:20px;height:20px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#efedf2;color:#5b5563}
.pill.g{background:var(--gr2);color:var(--gr)}.pill.a{background:var(--am2);color:var(--am)}.pill.r{background:var(--rd2);color:var(--rd)}.pill.p{background:var(--p3);color:var(--p)}
.empty{text-align:center;color:var(--mu);padding:30px 18px;font-size:13.5px}
.empty b{display:block;color:var(--tx);margin-bottom:4px;font-size:15px}
.day{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:14px 16px 6px;background:var(--bg)}
.acts{display:flex;gap:10px;overflow-x:auto;padding:2px 14px 4px;margin:0 -14px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:650;text-align:center}
.act i{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;box-shadow:0 1px 2px rgba(30,10,50,.06)}
.act:active i{background:var(--p3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#fff;font-weight:700;font-size:13px;color:#5b5563;border:1.5px solid transparent}
.chip.on{background:var(--p3);color:var(--p);border-color:var(--p)}
.people{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}.people::-webkit-scrollbar{display:none}
.ppl{flex:0 0 64px;text-align:center;font-size:12px;font-weight:600}
.ppl i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 5px;border-radius:50%;background:var(--p3);color:var(--p);font-style:normal;font-weight:800}
.ppl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar2{height:8px;border-radius:99px;background:#ece8f1;overflow:hidden;margin:10px 0 6px}.bar2 span{display:block;height:100%;background:var(--p);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--mu)}.kv span:last-child{font-weight:650;text-align:right;overflow-wrap:anywhere}

/* ---------- cartão ---------- */
.plastic{border-radius:20px;padding:20px;color:#fff;min-height:190px;background:linear-gradient(135deg,#9b2be8,#5b0a9a 70%,#3a0766);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 28px rgba(106,7,174,.3)}
.plastic:before{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.09)}
.plastic.off{filter:grayscale(1) brightness(.75)}
.plastic .nm{font-weight:800;letter-spacing:.14em;font-size:13px;display:flex;justify-content:space-between;align-items:center;position:relative}
.plastic .num{font-size:19px;letter-spacing:.1em;font-weight:650;position:relative;font-variant-numeric:tabular-nums}
.plastic .meta{display:flex;justify-content:space-between;font-size:12px;position:relative;gap:10px}
.plastic .meta span{opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- navegação ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + var(--bot));z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:650;color:#8c8695;border-radius:12px}
.nav button.on{color:var(--p)}
.nav button.on svg{stroke-width:2.2}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(18,8,28,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:22px 22px 0 0;max-height:92%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--bot)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:#d9d5df;margin:9px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px;flex:none}
.sheet .sh h2{margin:0;font-size:19px;letter-spacing:-.02em}
.sheet .sb{overflow-y:auto;padding:10px 18px 18px;-webkit-overflow-scrolling:touch}
.x{width:36px;height:36px;border-radius:50%;background:#f0eef3;display:grid;place-items:center;color:#5b5563}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ln);padding:6px 0;margin:6px 0 4px}
.amt:focus-within{border-color:var(--p)}
.amt b{font-size:24px;color:var(--mu)}
.amt input{border:0;outline:0;font-size:38px;font-weight:800;width:100%;min-width:0;letter-spacing:-.03em;background:none}
.ok{width:76px;height:76px;border-radius:50%;background:var(--gr2);color:var(--gr);display:grid;place-items:center;margin:8px auto 14px;animation:pop .35s ease}
.ok svg{width:38px;height:38px;stroke-width:2.6}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.code{background:var(--p3);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;color:var(--p2);margin:10px 0}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:8px;padding:14px;min-height:50vh}
.msg{max-width:82%;padding:10px 13px;border-radius:16px 16px 16px 4px;background:#fff;font-size:14px;align-self:flex-start;box-shadow:0 1px 2px rgba(30,10,50,.05);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--p);color:#fff;border-radius:16px 16px 4px 16px}
.msg small{display:block;font-size:10.5px;opacity:.7;margin-top:3px}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + var(--bot));background:var(--bg);border-top:1px solid var(--ln)}
.composer input{flex:1;min-width:0;border:1.5px solid var(--ln);border-radius:999px;padding:12px 16px;font-size:16px;outline:0;background:#fff}
.composer input:focus{border-color:var(--p)}
.composer button{width:46px;height:46px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;flex:none}

/* ---------- toast ---------- */
.toast{position:absolute;left:14px;right:14px;top:calc(12px + var(--top));z-index:80;padding:13px 16px;border-radius:14px;background:#2a2230;color:#fff;font-weight:650;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-140%);transition:transform .25s;pointer-events:none}
.toast.show{transform:none}.toast.ok2{background:#0b7a55}.toast.er{background:#b4233d}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
/* =================== utilidades =================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (n, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const initials = (name) => String(name || '?').trim().split(/\s+/).map((p) => p[0]).join('').slice(0, 2).toUpperCase();
const parseMoney = (v) => {
  let s = String(v ?? '').replace(/[^\d.,-]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  const n = Number(s); return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
};
const dShort = (iso) => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
const tShort = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const dLong = (iso) => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
function dayLabel(iso) {
  const d = new Date(iso), t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return 'Hoje';

  return d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
}
let toastTimer;
function toast(msg, kind = '') {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.className = `toast show ${kind === 'ok' ? 'ok2' : kind === 'err' ? 'er' : ''}`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200);
}
async function api(url, { method = 'GET', body } = {}) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (S.token) headers.Authorization = `Bearer ${S.token}`;
  let res;
  try { res = await fetch(url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined }); }
  catch { throw new Error('Sem conexão com o servidor. Verifique sua internet.'); }
  let data = {}; try { data = await res.json(); } catch {}
  if (res.status === 401 && S.token && !url.includes('/api/login')) { doLocalLogout(); throw new Error('Sua sessão expirou. Entre novamente.'); }
  if (!res.ok) throw new Error(data.message || 'Não foi possível concluir. Tente de novo.');
  return data;
}
async function busy(btn, fn) {
  const old = btn ? btn.innerHTML : ''; if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); } catch (e) { toast(e.message, 'err'); return null; }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}
const copyText = async (text, msg = 'Copiado!') => {
  try { await navigator.clipboard.writeText(text); toast(msg, 'ok'); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(msg, 'ok'); } catch { toast(text); } ta.remove(); }
};

function sheet(title, html, key = '') {
  $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = html; S.sheetKey = key;
  $('#scrim').classList.add('show'); $('#sheet').classList.add('show');
  const f = $('#sheetBody [autofocus], #sheetBody input:not([type=hidden])'); if (f && !('ontouchstart' in window)) setTimeout(() => f.focus(), 260);
}
function closeSheet() { S.sheetKey = ''; S.pix = null; $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); }
const sheetOpen = () => $('#sheet').classList.contains('show');
const amountField = (id, value = '', label = '') => `<div class="fld" style="margin-bottom:6px">${label ? `<label for="${id}">${label}</label>` : ''}<div class="amt"><b>R$</b><input id="${id}" name="amount" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(value)}" aria-label="Valor" /></div></div>`;

/* ---- recibo ---- */
function openReceipt(id) {
  const t = S.st.transactions.find((x) => x.id === id); if (!t) return;
  const rows = [['Tipo', t.title], t.counterparty ? [t.amount < 0 ? 'Para' : 'De', t.counterparty] : null, t.detail && !t.counterparty ? ['Detalhe', t.detail] : null, t.note ? ['Mensagem', t.note] : null, ['Data', `${dLong(t.createdAt)} às ${tShort(t.createdAt)}`], ['Forma', t.method === 'credit' ? 'Cartão de crédito' : t.method === 'savings' ? 'Cofrinho' : 'Saldo em conta'], ['Situação', 'Concluída'], ['Código', t.id]].filter(Boolean);
  sheet('Comprovante', `<div style="text-align:center;margin-bottom:8px"><div class="sm-t mu">${esc(t.title)}</div><div class="big ${t.amount > 0 ? 'in' : ''}">${t.amount > 0 ? '+' : '−'} ${fmtBRL(Math.abs(t.amount))}</div></div>${rows.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}<div class="btns" style="margin-top:14px"><button class="btn sec" data-act="shareReceipt" data-id="${esc(t.id)}">${ico('share')} Compartilhar comprovante</button></div>`);
}
/* ---- notificações ---- */
function openNotifs(refresh = false) {
  const list = S.st.notifications;
  const html = list.length ? `<div class="card flush" style="box-shadow:none;border:1px solid var(--ln)">${list.map((n) => `<div class="row"><span class="ic ${n.type === 'success' ? 'g' : n.type === 'warning' ? 'a' : ''}">${ico(n.type === 'success' ? 'check' : 'bell')}</span><span class="mid"><b style="white-space:normal">${esc(n.title)}${n.read ? '' : ' <span class="pill p">nova</span>'}</b><span style="white-space:normal">${esc(n.text)}</span><span>${dShort(n.createdAt)} · ${tShort(n.createdAt)}</span></span></div>`).join('')}</div>` : `<div class="empty"><b>Sem notificações</b>Avisaremos aqui sobre Pix, crédito e fatura.</div>`;
  sheet('Notificações', html, 'notifs');
  if (!refresh && unread()) api('/api/notifications/read', { method: 'POST' }).then((r) => { S.st = r.state; render(); }).catch(() => {});
}
/* ---- Pix: enviar ---- */
function pixStep1(msg = '') {
  sheet('Enviar Pix', `<form data-form="pixLookup"><p class="mu" style="margin-top:0">Para quem você quer enviar?</p><div class="fld"><label for="pk">Chave Pix</label><input id="pk" name="key" placeholder="E-mail, telefone, CPF ou chave aleatória" value="${esc(S.pix?.key || '')}" autocomplete="off" autocapitalize="none" required /><small>Dica: cole um código "Pix copia e cola" aqui.</small></div><div class="btns"><button class="btn" type="submit">Continuar</button><button class="btn sec" type="button" data-act="pasteKey">${ico('copy')} Colar da área de transferência</button></div></form>`, 'pix');
}
function pixStep2() {
  const r = S.pix.rec;
  sheet('Quanto enviar?', `<form data-form="pixReview"><div class="row" style="padding:0 0 12px;border:0"><span class="ic">${esc(r.initials)}</span><span class="mid"><b>${esc(r.name)}</b><span>${esc(r.key)}</span></span></div>${amountField('pa', S.pix.amount || '')}<div class="sm-t mu" style="margin-bottom:14px">Saldo disponível: ${fmtBRL(U().balance)}</div><div class="fld"><label for="pn">Mensagem (opcional)</label><input id="pn" name="note" maxlength="80" value="${esc(S.pix.note || '')}" placeholder="Ex.: almoço" /></div><div class="btns"><button class="btn" type="submit">Revisar</button><button class="btn sec" type="button" data-act="pixBack1">Trocar destinatário</button></div></form>`, 'pix');
}
function pixStep3() {
  const p = S.pix, r = p.rec;
  sheet('Confirmar Pix', `<div style="text-align:center;margin-bottom:6px"><div class="sm-t mu">Você vai enviar</div><div class="big">${fmtBRL(p.value)}</div></div><div class="kv"><span>Para</span><span>${esc(r.name)}</span></div><div class="kv"><span>Chave</span><span>${esc(r.key)}</span></div>${p.note ? `<div class="kv"><span>Mensagem</span><span>${esc(p.note)}</span></div>` : ''}<div class="kv"><span>Quando</span><span>Agora</span></div><div class="kv"><span>Saldo após</span><span>${fmtBRL(U().balance - p.value)}</span></div><div class="btns" style="margin-top:14px"><button class="btn" data-act="pixConfirm">Confirmar e enviar</button><button class="btn sec" data-act="pixBack2">Voltar</button></div>`, 'pix');
}
function pixDone(tx) {
  sheet('Pix enviado', `<div class="ok">${ico('check')}</div><div style="text-align:center"><div class="big">${fmtBRL(Math.abs(tx.amount))}</div><div class="mu">enviado para <b style="color:var(--tx)">${esc(tx.counterparty)}</b></div></div><div class="btns" style="margin-top:18px"><button class="btn sec" data-act="receipt" data-id="${esc(tx.id)}">Ver comprovante</button><button class="btn" data-act="closeSheet">Concluir</button></div>`);
}
/* ---- Pix: chaves ---- */
function openKeys(refresh = false) {
  const keys = U().pixKeys;
  sheet('Minhas chaves Pix', `<div class="card flush" style="box-shadow:none;border:1px solid var(--ln);margin-bottom:14px">${keys.map((k) => `<div class="row"><span class="ic g">${ico('key')}</span><span class="mid"><b>${esc(k.value)}</b><span style="text-transform:capitalize">${esc(k.type)}</span></span><button class="ib" style="color:var(--p)" data-act="copyKey" data-v="${esc(k.value)}" aria-label="Copiar chave">${ico('copy')}</button>${keys.length > 1 ? `<button class="ib" style="color:var(--rd)" data-act="delKey" data-id="${esc(k.id)}" aria-label="Remover chave">${ico('trash')}</button>` : ''}</div>`).join('')}</div>${keys.length < 5 ? `<form data-form="addKey"><div class="fld"><label for="kt">Nova chave</label><select id="kt" name="type" data-change="keyType"><option value="aleatória">Chave aleatória</option><option value="email">E-mail</option><option value="telefone">Telefone</option><option value="cpf">CPF</option></select></div><div class="fld hidden" id="kvWrap"><label for="kv">Valor da chave</label><input id="kv" name="value" autocomplete="off" autocapitalize="none" /></div><button class="btn" type="submit">${ico('plus')} Cadastrar chave</button></form>` : '<p class="mu sm-t">Você atingiu o limite de 5 chaves.</p>'}`, 'keys');
}
/* ---- Pix: cobrar ---- */
function openCharge() {
  const keys = U().pixKeys;
  sheet('Cobrar por Pix', `<form data-form="charge"><div class="fld"><label for="ck">Receber na chave</label><select id="ck" name="key">${keys.map((k) => `<option value="${esc(k.value)}">${esc(k.value)} (${esc(k.type)})</option>`).join('')}</select></div>${amountField('ca', '', 'Valor (opcional)')}<button class="btn" type="submit">Gerar código de cobrança</button></form><div id="chargeOut"></div>`);
}
/* ---- cofrinho ---- */
function openSavings(refresh = false) {
  const sv = S.st.savings; const m = Math.round(sv.balance * sv.monthlyRate * 100) / 100;
  sheet('Cofrinho', `<div style="text-align:center;margin-bottom:12px"><div class="sm-t mu">Guardado</div><div class="big">${fmtBRL(sv.balance)}</div><div class="sm-t mu">Rendimento estimado: ${fmtBRL(m)} por mês (1% a.m.)</div></div><form data-form="savings">${amountField('sa', '', 'Quanto?')}<div class="sm-t mu" style="margin-bottom:14px">Conta: ${fmtBRL(U().balance)} · Cofrinho: ${fmtBRL(sv.balance)}</div><div class="btns two"><button class="btn" type="submit" data-dir="in">Guardar</button><button class="btn out" type="submit" data-dir="out">Resgatar</button></div></form>`, 'cofre');
}
/* ---- fatura / saque / compra / crédito ---- */
function openInvoice() {
  const inv = S.st.invoice; if (inv.used <= 0) return toast('Sua fatura está zerada.');
  sheet('Pagar fatura', `<div style="text-align:center"><div class="sm-t mu">Fatura atual</div><div class="big">${fmtBRL(inv.used)}</div><div class="sm-t mu">Saldo em conta: ${fmtBRL(U().balance)}</div></div><form data-form="invoice">${amountField('ia', String(inv.used).replace('.', ','), 'Valor a pagar')}<div class="btns"><button class="btn" type="submit">Pagar fatura</button><button class="btn sec" type="button" data-act="fillAll" data-v="${inv.used}">Pagar valor total</button></div></form>`);
}
function openDraw() {
  sheet('Sacar do crédito', `<p class="mu" style="margin-top:0">O dinheiro cai na sua conta na hora. Cobramos <b>3%</b> sobre o valor, somados à fatura.</p><div class="sm-t mu">Limite disponível: <b style="color:var(--tx)">${fmtBRL(S.st.invoice.available)}</b></div><form data-form="draw">${amountField('da', '', 'Quanto você precisa?')}<button class="btn" type="submit">Sacar</button></form>`);
}
function openPurchase() {
  sheet('Simular compra', `<p class="mu" style="margin-top:0">Teste seu cartão: a compra entra na fatura. Disponível: <b style="color:var(--tx)">${fmtBRL(S.st.invoice.available)}</b></p><form data-form="purchase"><div class="fld"><label for="pm">Onde foi a compra?</label><input id="pm" name="merchant" maxlength="50" placeholder="Ex.: Taberna do Dragão" required /></div>${amountField('pv', '', 'Valor')}<button class="btn" type="submit">Comprar no crédito</button></form>`);
}
function openCreditReq() {
  const u = U(), reqs = S.st.creditRequests; const pending = reqs.some((r) => r.status === 'pending');
  const pill = (s) => s === 'pending' ? '<span class="pill a">em análise</span>' : s === 'approved' ? '<span class="pill g">aprovado</span>' : '<span class="pill r">reprovado</span>';
  sheet('Limite de crédito', `<div class="card" style="background:var(--p3);box-shadow:none;margin-bottom:14px"><div class="sm-t mu">Limite atual</div><div class="big" style="color:var(--p2)">${fmtBRL(S.st.invoice.limit)}</div><div class="sm-t mu">Score ${u.score} · Usado ${fmtBRL(S.st.invoice.used)}</div></div>${pending ? '<div class="empty" style="padding:10px"><b>Análise em andamento</b>O Armin vai decidir em breve — você será avisado.</div>' : `<form data-form="creditReq">${amountField('cra', '', 'Qual limite você quer?')}<div class="fld"><label for="crp">Para quê?</label><textarea id="crp" name="purpose" maxlength="100" required placeholder="Conte como vai usar o crédito"></textarea></div><button class="btn" type="submit">Enviar para análise</button></form>`}${reqs.length ? `<h3 style="margin:18px 0 4px;font-size:15px">Meus pedidos</h3>${reqs.map((r) => `<div class="kv"><span>${fmtBRL(r.amount)} · ${dShort(r.createdAt)}${r.decisionNote ? `<br><small>${esc(r.decisionNote)}</small>` : ''}</span><span>${pill(r.status)}</span></div>`).join('')}` : ''}`);
}
function openPassword() {
  sheet('Alterar senha', `<form data-form="password"><div class="fld"><label for="p0">Senha atual</label><input id="p0" name="current" type="password" autocomplete="current-password" required /></div><div class="fld"><label for="p1">Nova senha</label><input id="p1" name="next" type="password" autocomplete="new-password" minlength="6" required /><small>Mínimo de 6 caracteres.</small></div><button class="btn" type="submit">Salvar nova senha</button></form>`);
}
/* ---- master ---- */
function openThread(userId, refresh = false) {
  const t = S.master && S.master.threads.find((x) => x.userId === userId); if (!t) return;
  S.threadId = userId;
  sheet(t.name, `<div class="chat" style="padding:0 0 8px;min-height:0;max-height:46vh;overflow-y:auto">${t.messages.map((m) => `<div class="msg ${m.role === 'support' ? 'me' : ''}">${esc(m.text)}<small>${dShort(m.createdAt)} · ${tShort(m.createdAt)}</small></div>`).join('')}</div><form data-form="reply" class="composer" style="position:static;padding:8px 0 0;background:none;border:0"><input type="hidden" name="userId" value="${esc(userId)}" /><input id="ri" name="text" placeholder="Responder como Armin" maxlength="500" autocomplete="off" /><button type="submit" aria-label="Enviar">${ico('send')}</button></form>`, 'thread');
}
function openDeposit(id) {
  const p = S.master.users.find((x) => x.id === id); if (!p) return;
  sheet(`Depositar para ${p.fullName.split(' ')[0]}`, `<form data-form="deposit"><input type="hidden" name="userId" value="${esc(id)}" />${amountField('dv', '', 'Valor')}<div class="fld"><label for="dn">Motivo</label><input id="dn" name="note" maxlength="60" placeholder="Recompensa da guilda" /></div><button class="btn" type="submit">Depositar</button></form>`);
}

/* =================== ações =================== */
async function loadMaster() { if (!S.st || U().role !== 'admin') return; try { S.master = await api('/api/master/overview'); render(); } catch (e) { toast(e.message, 'err'); } }
function go(p) {
  if (!MAIN.includes(p)) S.back = MAIN.includes(S.page) ? S.page : S.back;
  S.page = p; closeSheet(); render(); const v = $('#view'); if (v) v.scrollTop = 0;
  if (p === 'master') loadMaster();
}
const setState = (r) => { if (r && r.state) { S.st = r.state; render(); } };
const A = {
  nav: (el) => go(el.dataset.p),
  back: () => go(S.back || 'home'),
  closeSheet,
  authTab: (el) => { S.authTab = el.dataset.t; render(); },
  demo: async (el) => { await busy(el, () => doLogin(el.dataset.u, el.dataset.p)); },
  toggleHide: () => { S.hidden = !S.hidden; localStorage.setItem('armin_hidden', S.hidden ? '1' : '0'); render(); },
  filter: (el) => { S.filter = el.dataset.f; render(); },
  receipt: (el) => openReceipt(el.dataset.id),
  shareReceipt: async (el) => {
    const t = S.st.transactions.find((x) => x.id === el.dataset.id); if (!t) return;
    const text = `Comprovante Armin Bank\n${t.title}: ${fmtBRL(Math.abs(t.amount))}\n${t.counterparty ? `${t.amount < 0 ? 'Para' : 'De'}: ${t.counterparty}\n` : ''}${dLong(t.createdAt)} ${tShort(t.createdAt)}\nCódigo: ${t.id}`;
    if (navigator.share) { try { await navigator.share({ title: 'Comprovante', text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    copyText(text, 'Comprovante copiado!');
  },
  notifs: () => openNotifs(),
  logout: async () => { try { await api('/api/logout', { method: 'POST' }); } catch {} doLocalLogout(); },
  password: openPassword,
  /* pix */
  pix: async (el) => { S.pix = { key: el.dataset.key || '' }; if (S.pix.key) { await lookupAndGo(S.pix.key); } else pixStep1(); },
  pixPaste: () => { S.pix = {}; pixStep1(); pasteInto(); },
  pasteKey: () => pasteInto(),
  pixBack1: () => { S.pix = { key: '' }; pixStep1(); },
  pixBack2: () => pixStep2(),
  pixConfirm: async (el) => {
    const p = S.pix; if (!p) return;
    const r = await busy(el, () => api('/api/pix/send', { method: 'POST', body: { key: p.rec.key, amount: p.value, description: p.note } }));
    if (r) { setState(r); pixDone(r.tx); }
  },
  keys: () => openKeys(),
  copyKey: (el) => copyText(el.dataset.v, 'Chave copiada!'),
  delKey: async (el) => { const r = await busy(el, () => api(`/api/pix/key/${encodeURIComponent(el.dataset.id)}`, { method: 'DELETE' })); if (r) { setState(r); toast('Chave removida.', 'ok'); } },
  charge: openCharge,
  copyCode: (el) => copyText(el.dataset.v, 'Código copiado!'),
  /* dinheiro */
  savings: () => openSavings(),
  invoice: openInvoice, draw: openDraw, purchase: openPurchase, creditReq: openCreditReq,
  fillAll: (el) => { const i = $('#ia'); if (i) i.value = String(el.dataset.v).replace('.', ','); },
  bonus: async (el) => { const r = await busy(el, () => api('/api/bonus', { method: 'POST' })); if (r) { setState(r); toast(`Você ganhou ${fmtBRL(r.reward)} de bônus!`, 'ok'); } },
  /* cartão */
  cardToggle: async (el) => { const r = await busy(el, () => api('/api/card/toggle', { method: 'POST' })); if (r) { setState(r); toast(U().cardBlocked ? 'Cartão bloqueado.' : 'Cartão desbloqueado.', 'ok'); } },
  cardReveal: async (el) => {
    if (S.card) { S.card = null; clearTimeout(S.cardTimer); return render(); }
    const r = await busy(el, () => api('/api/card/secret')); if (!r) return;
    S.card = r.card; render(); clearTimeout(S.cardTimer); S.cardTimer = setTimeout(() => { S.card = null; render(); }, 20000);
  },
  /* master */
  decide: async (el) => { const r = await busy(el, () => api(`/api/master/credit/${encodeURIComponent(el.dataset.id)}/${el.dataset.d}`, { method: 'POST', body: {} })); if (r) { toast(el.dataset.d === 'approve' ? 'Crédito aprovado.' : 'Análise reprovada.', 'ok'); loadMaster(); } },
  thread: (el) => openThread(el.dataset.id),
  deposit: (el) => openDeposit(el.dataset.id),
};
async function pasteInto() {
  try { const t = await navigator.clipboard.readText(); const i = $('#pk'); if (i && t) { i.value = t.trim(); toast('Colado!', 'ok'); } else toast('Nada para colar.'); }
  catch { toast('Seu navegador bloqueou a área de transferência. Cole manualmente no campo.'); $('#pk') && $('#pk').focus(); }
}
async function lookupAndGo(raw) {
  let key = String(raw || '').trim(), amount = '';
  if (key.startsWith('ZKPIX|')) { const [, k, a] = key.split('|'); key = k; if (a && Number(a) > 0) amount = String(a).replace('.', ','); }
  const r = await busy($('#sheetBody button[type=submit]'), () => api('/api/pix/lookup', { method: 'POST', body: { key } }));
  if (!r) { if (!sheetOpen()) pixStep1(); return; }
  S.pix = { ...S.pix, key, rec: r.recipient, amount }; pixStep2();
}
const CH = { keyType: (el) => { $('#kvWrap').classList.toggle('hidden', el.value === 'aleatória'); const k = $('#kv'); if (k) { k.required = el.value !== 'aleatória'; k.placeholder = { email: 'voce@email.com', telefone: '(11) 91234-5678', cpf: '000.000.000-00' }[el.value] || ''; } } };

/* ---- formulários ---- */
const F = {
  login: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); await busy(ev.submitter, () => doLogin(d.username, d.password)); },
  register: async (f, ev) => {
    const d = Object.fromEntries(new FormData(f));
    const r = await busy(ev.submitter, () => api('/api/register', { method: 'POST', body: d })); if (r) { enter(r); toast('Conta criada! Bem-vindo(a).', 'ok'); }
  },
  pixLookup: (f) => lookupAndGo(new FormData(f).get('key')),
  pixReview: (f) => {
    const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount);
    if (!(v > 0)) return toast('Digite um valor válido.', 'err');
    if (v > U().balance) return toast('Saldo insuficiente para este Pix.', 'err');
    S.pix.value = v; S.pix.amount = d.amount; S.pix.note = (d.note || '').trim(); pixStep3();
  },
  addKey: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/pix/key', { method: 'POST', body: d })); if (r) { setState(r); toast('Chave cadastrada!', 'ok'); } },
  charge: (f) => {
    const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); const hasV = d.amount.trim() !== '';
    if (hasV && !(v > 0)) return toast('Valor inválido.', 'err');
    const code = `ZKPIX|${d.key}|${hasV ? v.toFixed(2) : '0'}`;
    $('#chargeOut').innerHTML = `<div class="code">${esc(code)}</div><div class="btns"><button class="btn" data-act="copyCode" data-v="${esc(code)}">${ico('copy')} Copiar código</button></div><p class="mu sm-t">Envie este código. Quem for pagar cola em <b>Pix → Pagar com código</b>.</p>`;
  },
  savings: async (f, ev) => {
    const v = parseMoney(new FormData(f).get('amount')); if (!(v > 0)) return toast('Digite um valor válido.', 'err');
    const dir = (ev.submitter && ev.submitter.dataset.dir) || 'in';
    const r = await busy(ev.submitter, () => api(`/api/savings/${dir}`, { method: 'POST', body: { amount: v } }));
    if (r) { setState(r); openSavings(); toast(dir === 'in' ? 'Guardado com sucesso!' : 'Resgate feito — dinheiro na conta.', 'ok'); }
  },
  invoice: async (f, ev) => { const v = parseMoney(new FormData(f).get('amount')); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/credit/pay', { method: 'POST', body: { amount: v } })); if (r) { setState(r); closeSheet(); toast('Fatura paga!', 'ok'); } },
  draw: async (f, ev) => { const v = parseMoney(new FormData(f).get('amount')); if (!(v >= 10)) return toast('O valor mínimo é R$ 10,00.', 'err'); const r = await busy(ev.submitter, () => api('/api/credit/draw', { method: 'POST', body: { amount: v } })); if (r) { setState(r); closeSheet(); toast(`${fmtBRL(v)} na sua conta!`, 'ok'); } },
  purchase: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/card/purchase', { method: 'POST', body: { merchant: d.merchant, amount: v } })); if (r) { setState(r); closeSheet(); toast('Compra aprovada!', 'ok'); } },
  creditReq: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v >= 100)) return toast('Peça pelo menos R$ 100,00.', 'err'); const r = await busy(ev.submitter, () => api('/api/credit/request', { method: 'POST', body: { amount: v, purpose: d.purpose } })); if (r) { setState(r); openCreditReq(); toast(r.message, 'ok'); } },
  password: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/password', { method: 'POST', body: d })); if (r) { S.token = r.token; localStorage.setItem('armin_token', r.token); connectSocket(); setState(r); closeSheet(); toast('Senha alterada!', 'ok'); } },
  support: async (f, ev) => {
    const text = new FormData(f).get('text') ?? $('#chatIn').value; const t = String(text).trim(); if (!t) return;
    const r = await busy(ev.submitter, () => api('/api/support/messages', { method: 'POST', body: { text: t } })); if (r) { $('#chatIn').value = ''; setState(r); }
  },
  reply: async (f, ev) => {
    const d = Object.fromEntries(new FormData(f)); if (!String(d.text).trim()) return;
    const r = await busy(ev.submitter, () => api('/api/master/support/reply', { method: 'POST', body: d })); if (r) { await loadMaster(); openThread(d.userId, true); }
  },
  deposit: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/master/deposit', { method: 'POST', body: { userId: d.userId, amount: v, note: d.note } })); if (r) { closeSheet(); toast('Depósito feito.', 'ok'); loadMaster(); } },
};

/* =================== sessão e tempo real =================== */
async function doLogin(username, password) { const r = await api('/api/login', { method: 'POST', body: { username, password } }); enter(r); toast(`Olá, ${r.state.user.fullName.split(' ')[0]}!`, 'ok'); }
function enter(r) { S.token = r.token; localStorage.setItem('armin_token', S.token); S.st = r.state; S.page = 'home'; S.master = null; render(); connectSocket(); }
function doLocalLogout() {
  localStorage.removeItem('armin_token'); S.token = ''; S.st = null; S.master = null; S.card = null; S.page = 'home'; S.authTab = 'login';
  if (S.socket) { S.socket.disconnect(); S.socket = null; } closeSheet(); render();
}
function connectSocket() {
  if (S.socket) { S.socket.disconnect(); S.socket = null; }
  if (typeof io === 'undefined' || !S.token) return;
  S.socket = io({ auth: { token: S.token }, reconnectionDelayMax: 8000 });
  S.socket.on('account:updated', (p) => { if (p.state) { S.st = p.state; render(); } });
  S.socket.on('master:refresh', () => { if (S.page === 'master') loadMaster(); });
}
async function poll() { if (!S.token || !S.st || document.hidden) return; try { const r = await api('/api/me'); if (JSON.stringify(r.state) !== JSON.stringify(S.st)) { S.st = r.state; render(); } } catch {} }

/* =================== eventos globais =================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) { console.warn('Ação sem handler:', el.dataset.act); return; }
  e.preventDefault(); fn(el, e);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const fn = F[f.dataset.form]; if (fn) fn(f, e); else console.warn('Form sem handler:', f.dataset.form);
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CH[el.dataset.change]) CH[el.dataset.change](el); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetOpen()) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
setInterval(poll, 25000);

/* =================== boot =================== */
$('#root').innerHTML = shell();
(async function boot() {
  render();
  if (!S.token) return;
  try { const r = await api('/api/me'); S.st = r.state; render(); connectSocket(); }
  catch (e) { if (S.token) { /* erro de rede: mantém token, mostra login */ } render(); }
})();
</script>
