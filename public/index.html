<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="Armin Bank — conta digital com Pix, cartão, cofrinho e crédito." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<title>Armin Bank</title>
<style>
:root{--bg:#000;--card:#141416;--card2:#1e1e22;--tx:#fff;--mu:#8e8e96;--ln:#26262b;--p:#820ad1;--p2:#9b1be8;--p3:#2a1240;--gr:#00c853;--gr2:#0e3b22;--rd:#ff5a76;--rd2:#3b1220;--am:#ffb020;--am2:#3b2a0e;--r:16px;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:disabled{opacity:.55;cursor:default}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
#root{height:100%;max-width:480px;margin:0 auto;position:relative;background:var(--bg)}
@media(min-width:520px){body{background:#000}#root{height:min(100%,900px);margin-top:max(0px,calc((100vh - 900px)/2));overflow:hidden;border-radius:24px;box-shadow:0 0 0 1px #1e1e22}}
/* login — fundo PRETO, detalhes roxos */
.auth{height:100%;overflow-y:auto;background:var(--bg);color:#fff;padding:calc(36px + var(--top)) 24px calc(28px + var(--bot));display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:15px}
.logo b{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:19px;letter-spacing:0}
.auth h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:44px 0 8px;color:#fff}
.auth>p{margin:0 0 24px;color:var(--mu)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{padding:10px;border-radius:9px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--p);color:#fff}
.auth .fld label{color:var(--mu)}
.fld{margin:0 0 14px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:14px;background:var(--card2);color:#fff;outline:0;font-size:16px;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(130,10,209,.35)}
.fld small{display:block;color:var(--mu);margin-top:5px;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:999px;background:var(--p);color:#fff;font-weight:700;font-size:15.5px;padding:0 22px}
.btn:active:not(:disabled){filter:brightness(.9)}
.btn.sec{background:var(--card2);color:#c77dff}
.btn.out{background:transparent;color:#c77dff;border:1.5px solid var(--p)}
.btn.dng{background:var(--rd2);color:var(--rd)}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 16px;width:auto}
.btns{display:grid;gap:10px;margin-top:6px}
.btns.two{grid-template-columns:1fr 1fr}
.lnk{color:#c77dff;font-weight:700;font-size:13.5px}
.demo{margin-top:auto;padding-top:26px;font-size:12px;color:var(--mu);text-align:center}
.demo button{display:inline-block;margin:6px 4px 0;padding:8px 12px;border-radius:999px;background:var(--card2);color:#fff;font-weight:700;font-size:12px}
/* app */
.app{height:100%;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(84px + var(--bot))}
.view.sub{padding-bottom:calc(24px + var(--bot))}
.hdr{background:var(--bg);color:#fff;padding:calc(14px + var(--top)) 18px 22px}
.hdr .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.hdr .tools{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:inherit;position:relative}
.ib:active{background:var(--card2)}
.hdr h1{margin:10px 0 0;font-size:26px;letter-spacing:-.03em;line-height:1.15;color:#fff}
.hdr p{margin:4px 0 0;color:var(--mu);font-size:13.5px}
.av{width:42px;height:42px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--rd);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.wrap{padding:14px 14px 0;display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px}
.card.flush{padding:0;overflow:hidden}
.ttl{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.ttl h3{margin:0;font-size:15px;color:#fff}
.mu{color:var(--mu)}.sm-t{font-size:12.5px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0;color:#fff}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--ln);background:var(--card)}
.row:last-child{border-bottom:0}
button.row:active{background:var(--card2)}
.row .ic{width:40px;height:40px;border-radius:50%;background:var(--p3);color:#c77dff;display:grid;place-items:center;flex:none}
.row .ic.g{background:var(--gr2);color:var(--gr)}.row .ic.r{background:var(--rd2);color:var(--rd)}.row .ic.a{background:var(--am2);color:var(--am)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:14.5px;font-weight:650;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid span{display:block;font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:right;font-weight:700;font-size:14.5px;flex:none;max-width:44%;color:#fff}
.row .end small{display:block;font-weight:500;font-size:11.5px;color:var(--mu)}
.in{color:var(--gr)}.out{color:var(--tx)}
.chev{color:#55555c;width:20px;height:20px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--card2);color:var(--mu)}
.pill.g{background:var(--gr2);color:var(--gr)}.pill.r{background:var(--rd2);color:var(--rd)}.pill.p{background:var(--p3);color:#c77dff}
.empty{text-align:center;color:var(--mu);padding:30px 18px;font-size:13.5px}
.empty b{display:block;color:#fff;margin-bottom:4px;font-size:15px}
.day{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:14px 16px 6px;background:var(--card)}
.acts{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:650;text-align:center;color:var(--mu)}
.act i{width:58px;height:58px;border-radius:50%;background:var(--card2);color:#c77dff;display:grid;place-items:center}
.act:active i{background:var(--p3)}
.bar2{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin:10px 0 6px}.bar2 span{display:block;height:100%;background:var(--p);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--mu)}.kv span:last-child{font-weight:650;text-align:right;color:#fff;overflow-wrap:anywhere}
/* cartão roxo (o plástico pode ser roxo, como o cartão real da Nubank) */
.plastic{border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;aspect-ratio:1.6/1;background:linear-gradient(135deg,#820ad1 0%,#4a0476 100%)}
.plastic::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.16) 0,transparent 40%);pointer-events:none}
.plastic .chipic{position:absolute;top:20px;left:20px;width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#d4af37,#f4d03f)}
.plastic .tp{position:absolute;top:22px;right:20px}
.plastic .num{position:absolute;left:20px;right:20px;bottom:44px;font-family:'Courier New',monospace;font-size:19px;letter-spacing:.12em;font-weight:700}
.plastic .foot{position:absolute;left:20px;right:20px;bottom:18px;display:flex;justify-content:space-between;font-size:12px}
.blocked{filter:grayscale(.85) brightness(.75)}
/* tabs pretas */
.tabs{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--ln);padding:8px 0 calc(8px + var(--bot))}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:700;color:var(--mu)}
.tab.on{color:#c77dff}
.tab i{width:26px;height:26px}
/* sheet preto */
.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;padding:0 18px calc(18px + var(--bot));box-shadow:0 -8px 24px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .25s ease-out;z-index:10;max-height:85%;overflow-y:auto}
.sheet.open{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--ln);margin:10px auto 14px}
.sheet h2{margin:0 0 14px;font-size:20px;letter-spacing:-.02em;color:#fff}
.sheet h3{color:#fff}
.sheet .close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--mu)}
.code{background:#000;border:1.5px dashed var(--ln);border-radius:12px;padding:14px;font-family:'Courier New',monospace;font-size:12px;word-break:break-all;margin:14px 0;color:#fff}
.chat{display:flex;flex-direction:column;gap:10px;padding:10px 0}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.msg.user{align-self:flex-end;background:var(--p);color:#fff;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:var(--card2);color:#fff;border-bottom-left-radius:4px}
.msg .who{display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:3px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.stat .b{background:var(--card);border-radius:12px;padding:14px;text-align:center}
.stat .b b{display:block;font-size:20px;font-weight:800;color:#c77dff;margin-bottom:4px}
.stat .b span{font-size:11px;color:var(--mu);font-weight:700}
.toast{position:fixed;top:calc(20px + var(--top));left:50%;transform:translateX(-50%) translateY(-120px);background:var(--card2);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.6);z-index:100;transition:transform .3s;max-width:calc(100% - 40px);border:1.5px solid var(--ln)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--gr);color:var(--gr)}
.toast.err{border-color:var(--rd);color:var(--rd)}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:200}
.busy i{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtBRL = (v) => Number(v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const fmtDate = (d) => new Date(d).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
const parseMoney = (s) => { const n = Number(String(s).replace(/\./g,'').replace(',','.')); return Number.isFinite(n) ? n : 0; };
const U = () => (S.st && S.st.user) || {};
const ini = () => ((U().fullName || U().username || '?')[0] || '?').toUpperCase();

const ICO = { home:'<path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/>', pix:'<path d="M9 5l-4 7 4 7M15 5l4 7-4 7"/>', card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>', pig:'<path d="M19 8c-2-2-5-3-8-3s-6 1-8 3c-1 1-1 3 0 4 2 2 5 3 8 3s6-1 8-3c1-1 1-3 0-4z"/><circle cx="8" cy="11" r="1" fill="currentColor"/>', credit:'<path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>', bell:'<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>', help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 0c0 2-2.5 3-2.5 3M12 17h.01"/>', chev:'<path d="M9 6l6 6-6 6"/>', arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M20 6L9 17l-5-5"/>', close:'<path d="M18 6L6 18M6 6l12 12"/>', copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>', trash:'<path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>', lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>', eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>', bonus:'<path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 17l-6.5 4 2-7.5L2 9h7z"/>', logout:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>', refresh:'<path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>' };
const ico = (k) => `<svg class="i" viewBox="0 0 24 24">${ICO[k] || ''}</svg>`;

const S = { token: localStorage.getItem('armin_token') || '', st: null, master: null, page: 'home', authTab: 'login', socket: null, card: null, cardTimer: null, pix: { key:'', rec:null, amount:'', value:0, note:'' }, toastTimer: null, sheetEl: null };

async function api(p, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.token) headers.authorization = `Bearer ${S.token}`;
  const r = await fetch(p, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : null });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || 'Erro na requisição');
  return j;
}
async function busy(el, fn) {
  if (el) el.disabled = true;
  const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = '<i></i>'; document.body.appendChild(b);
  try { return await fn(); } catch (e) { toast(e.message, 'err'); return null; } finally { document.body.removeChild(b); if (el) el.disabled = false; }
}
function toast(msg, type = '') {
  clearTimeout(S.toastTimer);
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.className = `toast show ${type}`; t.textContent = msg;
  S.toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);
}
function sheetOpen(html) {
  sheetClose();
  const s = document.createElement('div'); s.className = 'sheet open';
  s.innerHTML = `<div class="grip"></div><button class="close" data-act="closeSheet">${ico('close')}</button>${html}`;
  $('#root').appendChild(s); S.sheetEl = s; return s;
}
function sheetClose() { if (S.sheetEl) { S.sheetEl.remove(); S.sheetEl = null; } }
function setState(r) { if (r && r.state) S.st = r.state; render(); }
async function loadMaster() { try { const m = await api('/api/master/overview'); S.master = m; render(); } catch (e) { toast(e.message, 'err'); } }

function shell() { return `<div class="app"><div id="view" class="view"></div><nav class="tabs" id="tabs"></nav></div>`; }
function render() {
  sheetClose();
  if (!S.token || !S.st) { renderAuth(); return; }
  $('#root').innerHTML = shell();
  $('#tabs').innerHTML = tabsHtml();
  if (S.page === 'master' && U().role === 'admin') renderMaster();
  else if (S.page === 'pix') renderExtract();
  else if (S.page === 'card') renderCardPage();
  else if (S.page === 'more') renderMore();
  else renderHome();
}
function tabsHtml() {
  return [ {id:'home',l:'Início',i:'home'}, {id:'pix',l:'Extrato',i:'pix'}, {id:'card',l:'Cartão',i:'card'}, {id:'more',l:'Mais',i:'plus'} ]
    .map(t => `<button class="tab ${S.page===t.id?'on':''}" data-act="goPage" data-page="${t.id}">${ico(t.i)}${t.l}</button>`).join('');
}
function renderAuth() {
  const tab = S.authTab;
  $('#root').innerHTML = `
  <div class="auth">
    <div class="logo"><b>A</b> ARMIN BANK</div>
    <h1>Seu banco digital<br>sem complicação</h1>
    <p>Pix, cartão, cofrinho e crédito em um só lugar.</p>
    <div class="seg">
      <button class="${tab==='login'?'on':''}" data-act="switchAuth" data-tab="login">Entrar</button>
      <button class="${tab==='register'?'on':''}" data-act="switchAuth" data-tab="register">Criar conta</button>
    </div>
    ${tab === 'login' ? `
      <form data-form="login">
        <div class="fld"><label>Usuário ou e-mail</label><input name="username" required autocomplete="username"></div>
        <div class="fld"><label>Senha</label><input name="password" type="password" required autocomplete="current-password"></div>
        <button class="btn" type="submit">${ico('arrow')} Entrar</button>
      </form>` : `
      <form data-form="register">
        <div class="fld"><label>Nome completo</label><input name="fullName" required placeholder="Nome e sobrenome"></div>
        <div class="fld"><label>Usuário</label><input name="username" required pattern="[a-zA-Z0-9_]+" placeholder="só letras, números e _"><small>Sem espaços nem acentos</small></div>
        <div class="fld"><label>Senha</label><input name="password" type="password" required minlength="4" placeholder="mínimo 4 caracteres"></div>
        <button class="btn" type="submit">${ico('check')} Criar conta grátis</button>
      </form>`}
    <div class="demo"><p>Contas de demonstração:</p>
      <button data-act="demoLogin" data-u="aventureiro" data-p="1234">Lia (user)</button>
      <button data-act="demoLogin" data-u="master" data-p="master">Armin (admin)</button>
    </div>
  </div>`;
}
function txRow(tx) {
  const isIn = (tx.amount || 0) >= 0;
  const icon = (tx.kind||'').includes('pix') ? 'pix' : tx.kind === 'card' ? 'card' : tx.kind === 'savings_yield' ? 'pig' : tx.kind === 'deposit' ? 'bonus' : 'arrow';
  return `<div class="row"><div class="ic ${isIn?'g':'r'}">${ico(icon)}</div><div class="mid"><b>${esc(tx.description || tx.title || 'Movimentação')}</b><span>${fmtDate(tx.createdAt)}</span></div><div class="end ${isIn?'in':'out'}">${isIn?'+':'-'}${fmtBRL(Math.abs(tx.amount))}</div></div>`;
}
function renderHome() {
  const u = U(); const txs = (S.st.transactions || []).slice(0, 5); const unread = S.st.unread || 0;
  $('#view').innerHTML = `
  <div class="hdr"><div class="bar"><div class="av">${ini()}</div>
    <div class="tools">
      <button class="ib" data-act="openNotifs">${ico('bell')}${unread ? `<span class="dot">${unread}</span>` : ''}</button>
      <button class="ib" data-act="openSupport">${ico('help')}</button>
      <button class="ib" data-act="logout">${ico('logout')}</button>
    </div></div>
    <h1>Olá, ${esc((u.fullName||u.username||'').split(' ')[0])}</h1><p>Saldo disponível</p></div>
  <div class="wrap">
    <div class="card"><div class="big">${fmtBRL(u.balance)}</div>
      <div class="acts">
        <button class="act" data-act="openPix"><i>${ico('pix')}</i>Pix</button>
        <button class="act" data-act="openSavings"><i>${ico('pig')}</i>Cofrinho</button>
        <button class="act" data-act="openCard"><i>${ico('card')}</i>Cartão</button>

  password: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/password', { method:'POST', body:d })); if (r) { S.token = r.token; localStorage.setItem('armin_token', r.token); connectSocket(); setState(r); sheetClose(); toast('Senha alterada!', 'ok'); } },
  support: async (f, ev) => { const t = String(new FormData(f).get('text') || '').trim(); if (!t) return; const r = await busy(ev.submitter, () => api('/api/support/messages', { method:'POST', body:{ text:t } })); if (r) setState(r); },
  reply: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); if (!String(d.text).trim()) return; const r = await busy(ev.submitter, () => api('/api/master/support/reply', { method:'POST', body:d })); if (r) { await loadMaster(); openThread(d.userId); } },
  deposit: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/master/deposit', { method:'POST', body:{ userId:d.userId, amount:v, note:d.note } })); if (r) { sheetClose(); toast('Depósito feito.', 'ok'); loadMaster(); } },
};
const CH = { keyType: (el) => { const w = $('#kvWrap'); if (w) w.classList.toggle('hidden', el.value === 'aleatória'); const k = $('#kv'); if (k) { k.required = el.value !== 'aleatória'; k.placeholder = { email:'voce@email.com', telefone:'(11) 91234-5678' }[el.value] || ''; } } };

/* ---------- sessão / tempo real ---------- */
function enter(r) { S.token = r.token; localStorage.setItem('armin_token', S.token); S.st = r.state; S.page = 'home'; S.master = null; render(); connectSocket(); }
function doLocalLogout() { localStorage.removeItem('armin_token'); S.token = ''; S.st = null; S.master = null; S.card = null; S.page = 'home'; S.authTab = 'login'; if (S.socket) { S.socket.disconnect(); S.socket = null; } render(); }
function connectSocket() {
  if (S.socket) { S.socket.disconnect(); S.socket = null; }
  if (typeof io === 'undefined' || !S.token) return;
  S.socket = io({ auth: { token: S.token }, reconnectionDelayMax: 8000 });
  S.socket.on('account:updated', (p) => { if (p.state) { S.st = p.state; render(); } });
  S.socket.on('master:refresh', () => { if (S.page === 'master') loadMaster(); });
}
async function poll() { if (!S.token || !S.st || document.hidden) return; try { const r = await api('/api/me'); if (JSON.stringify(r.state) !== JSON.stringify(S.st)) { S.st = r.state; render(); } } catch (e) {} }

document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = A[el.dataset.act]; if (!fn) return; e.preventDefault(); fn(el, e); });
document.addEventListener('submit', (e) => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = F[f.dataset.form]; if (fn) fn(f, e); });
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CH[el.dataset.change]) CH[el.dataset.change](el); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') sheetClose(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
setInterval(poll, 25000);

$('#root').innerHTML = shell();
(async function boot() {
  render();
  if (!S.token) return;
  try { const r = await api('/api/me'); S.st = r.state; render(); connectSocket(); }
  catch (e) { localStorage.removeItem('armin_token'); S.token = ''; S.st = null; render(); }
})();
</script>
</body>
