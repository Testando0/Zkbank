<html lang="pt-BR">
<head>

<title>GhsotBank</title>
<style>
:root{--bg:#000;--card:#141416;--card2:#1e1e22;--tx:#fff;--mu:#8e8e96;--ln:#26262b;--p:#820ad1;--p2:#9b1be8;--p3:#2a1240;--gr:#00c853;--gr2:#0e3b22;--rd:#ff5a76;--rd2:#3b1220;--am:#ffb020;--am2:#3b2a0e;--r:16px;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;touch-action:manipulation}
body{font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:disabled{opacity:.55;cursor:default}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
#root{height:100vh;height:100dvh;max-width:480px;margin:0 auto;position:relative;background:var(--bg)}
@media(min-width:520px){body{background:#000}#root{height:min(100dvh,900px);margin-top:max(0px,calc((100dvh - 900px)/2));border-radius:24px;box-shadow:0 0 0 1px #1e1e22;overflow:hidden}}
.auth{height:100%;overflow-y:auto;background:var(--bg);color:#fff;padding:calc(36px + var(--top)) 24px calc(28px + var(--bot));display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:15px}
.logo b{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:19px;letter-spacing:0}
.auth h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:44px 0 8px;color:#fff}
.auth>p{margin:0 0 24px;color:var(--mu)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{padding:10px;border-radius:9px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--p);color:#fff}
.fld{margin:0 0 14px;min-width:0}

.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:14px;background:var(--card2);color:#fff;outline:0;font-size:16px;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(130,10,209,.35)}
.fld small{display:block;color:var(--mu);margin-top:5px;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:999px;background:var(--p);color:#fff;font-weight:700;font-size:15.5px;padding:0 22px}
.btn:active:not(:disabled){filter:brightness(.9)}
.btn.sec{background:var(--card2);color:#c77dff}
.btn.out{background:transparent;color:#c77dff;border:1.5px solid var(--p)}
.btn.dng{background:var(--rd2);color:var(--rd)}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 16px;width:auto}
.btns{display:grid;gap:10px;margin-top:6px}
.btns.two{grid-template-columns:1fr 1fr}
.lnk{color:#c77dff;font-weight:700;font-size:13.5px}
.demo{margin-top:auto;padding-top:26px;font-size:12px;color:var(--mu);text-align:center}
.demo button{display:inline-block;margin:6px 4px 0;padding:8px 12px;border-radius:999px;background:var(--card2);color:#fff;font-weight:700;font-size:12px}
.app{height:100%;display:flex;flex-direction:column}
.view{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(92px + var(--bot))}
.hdr{background:var(--bg);color:#fff;padding:calc(14px + var(--top)) 18px 22px}
.hdr .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.hdr .tools{display:flex;gap:4px;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:inherit;position:relative}
.ib:active{background:var(--card2)}
.hdr h1{margin:10px 0 0;font-size:26px;letter-spacing:-.03em;line-height:1.15;color:#fff}
.hdr p{margin:4px 0 0;color:var(--mu);font-size:13.5px}
.hdr .balance{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:10px 0 0;color:#fff}
.av{width:42px;height:42px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.profile-button{width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center}
.dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--rd);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.wrap{padding:14px 14px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.wrap>*{min-width:0}
.home-hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;background:linear-gradient(135deg,#26083d 0%,#6812a0 52%,#a832d8 100%);box-shadow:0 14px 32px rgba(130,10,209,.22)}
.home-hero::after{content:"";position:absolute;width:180px;height:180px;right:-55px;top:-70px;border-radius:50%;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 20px rgba(255,255,255,.04),0 0 0 42px rgba(255,255,255,.03)}
.home-hero>*{position:relative;z-index:1}.home-hero .eyebrow{color:#e9c8ff;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.home-hero .balance{font-size:35px;margin:10px 0 3px}.home-hero p{color:#e5c9f2;margin:0;font-size:13px}
.home-hero .hero-actions{display:flex;gap:8px;margin-top:18px}.hero-actions button{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;min-height:42px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:750;padding:0 10px}.hero-actions button:first-child{background:#fff;color:#6812a0}.hero-actions .i{width:17px;height:17px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:6px 2px 0}.section-head h2,.quick-title h2{font-size:18px;letter-spacing:-.02em;margin:0}.section-head p{font-size:12px;color:var(--mu);margin:3px 0 0}
.shortcut-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.shortcut{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;text-align:center;background:var(--card);border:1px solid rgba(255,255,255,.04);border-radius:16px;padding:12px 6px;color:#fff;min-height:92px;transition:transform .15s,border-color .15s}.shortcut:active{transform:scale(.97)}.shortcut .shortcut-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--p3);color:#d89bff;margin-bottom:8px}.shortcut .shortcut-icon .i{width:19px;height:19px}.shortcut b{display:block;width:100%;font-size:11.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shortcut span:last-child{display:block;width:100%;color:var(--mu);font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quick-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.more-toggle{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:#fff;box-shadow:0 6px 14px rgba(130,10,209,.35);transition:transform .2s}.more-toggle.open{transform:rotate(45deg);background:var(--card2);color:#d89bff}.home-menu{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .25s ease,opacity .2s ease}.home-menu.open{grid-template-rows:1fr;opacity:1}.home-menu-inner{overflow:hidden;padding-top:0}.home-menu.open .home-menu-inner{padding-top:8px}
.shop-hero{position:relative;overflow:hidden;border-radius:24px;padding:22px;background:linear-gradient(145deg,#120b1d,#35104f 55%,#8b16c5);min-height:178px}.shop-hero::before{content:"✦";position:absolute;right:24px;top:10px;color:rgba(255,255,255,.35);font-size:88px;line-height:1}.shop-hero h2{position:relative;font-size:28px;line-height:1.05;max-width:230px;margin:5px 0 8px;letter-spacing:-.04em}.shop-hero p{position:relative;color:#e3c8ee;font-size:13px;max-width:255px;margin:0}.shop-hero .eyebrow{position:relative;color:#f1caff;text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:800}.shop-balances{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-28px;position:relative;z-index:2}.shop-balance{background:rgba(30,30,34,.96);border:1px solid var(--ln);border-radius:14px;padding:11px 8px;min-width:0}.shop-balance strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shop-balance span{display:block;color:var(--mu);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shop-toolbar{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.shop-toolbar::-webkit-scrollbar{display:none}.shop-chip{flex:0 0 auto;border:1px solid var(--ln);background:var(--card);color:var(--mu);border-radius:999px;padding:9px 12px;font-size:11.5px;font-weight:750}.shop-chip.on{background:var(--p3);border-color:var(--p);color:#e1b6ff}.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product-card{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:18px;padding:12px;display:flex;flex-direction:column;min-height:214px;position:relative}.product-art{height:82px;border-radius:14px;background:radial-gradient(circle at 70% 28%,#d273ff 0,#8c18c5 22%,#32104b 70%);display:grid;place-items:center;color:#fff;font-size:33px;margin-bottom:11px}.product-card:nth-child(3n+2) .product-art{background:radial-gradient(circle at 30% 30%,#ffcf70 0,#bd6222 24%,#422014 75%)}.product-card:nth-child(3n) .product-art{background:radial-gradient(circle at 60% 25%,#79e6c0 0,#168b79 25%,#103c40 75%)}.product-card h3{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product-card p{color:var(--mu);font-size:11px;line-height:1.35;margin:5px 0 9px;min-height:30px}.product-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}.product-price{font-weight:800;font-size:14px}.product-price small{display:block;color:var(--mu);font-size:9px;font-weight:600;margin-top:2px}.product-buy{background:var(--p);color:#fff;border-radius:10px;padding:9px 10px;font-size:11px;font-weight:800}.payment-strip{display:flex;gap:7px;flex-wrap:wrap}.payment-tag{background:var(--card2);color:#d8a5f2;border-radius:999px;padding:7px 9px;font-size:10.5px;font-weight:700}
.product-art{overflow:hidden}.product-art img{width:100%;height:100%;object-fit:cover}
.product-card{cursor:pointer}.product-admin{display:flex;justify-content:space-between;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid var(--ln);font-size:11px}.danger-link{color:var(--rd)}
.magic-wallet{text-align:left;border:1px solid rgba(199,125,255,.3);background:linear-gradient(110deg,#21102f,#351047);color:#fff}.magic-wallet b{display:block;font-size:14px}.magic-wallet span{display:block;color:#d4acdF;font-size:11px;margin-top:4px}
.vehicle-card{margin-bottom:10px}.vehicle-image{height:150px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#24102f,#7b1fc1);display:grid;place-items:center;font-size:52px;margin-bottom:12px}.vehicle-image img{width:100%;height:100%;object-fit:cover}
.score-card{background:linear-gradient(135deg,#18121f,#2d1241);border:1px solid rgba(199,125,255,.25)}.score-ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:4px auto 14px;background:conic-gradient(var(--p2) var(--score),#302c35 0);position:relative}.score-ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#18121f}.score-ring b,.score-ring span{position:relative;z-index:1}.score-ring b{font-size:27px}.score-ring span{font-size:10px;color:var(--mu);margin-top:31px;position:absolute}
.product-detail-image{width:100%;min-height:180px;max-height:55vh;border-radius:18px;background:#0b0b0d;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;font-size:70px;margin-bottom:14px;padding:8px}.product-detail-image img{display:block;width:auto;height:auto;max-width:100%;max-height:55vh;object-fit:contain;object-position:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.ttl{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:8px}
.ttl h3{margin:0;font-size:15px;color:#fff}
.mu{color:var(--mu)}.sm-t{font-size:12.5px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0;color:#fff}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--ln);background:var(--card);min-width:0}
.row:last-child{border-bottom:0}
button.row:active{background:var(--card2)}
.row .ic{width:40px;height:40px;border-radius:50%;background:var(--p3);color:#c77dff;display:grid;place-items:center;flex:none}
.row .ic.g{background:var(--gr2);color:var(--gr)}.row .ic.r{background:var(--rd2);color:var(--rd)}.row .ic.a{background:var(--am2);color:var(--am)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:14.5px;font-weight:650;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid span{display:block;font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:right;font-weight:700;font-size:14.5px;flex:none;max-width:44%;color:#fff}
.row .end small{display:block;font-weight:500;font-size:11.5px;color:var(--mu)}
.in{color:var(--gr)}.out{color:var(--tx)}
.chev{color:#55555c;width:20px;height:20px;flex:none}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--card2);color:var(--mu)}
.pill.g{background:var(--gr2);color:var(--gr)}.pill.r{background:var(--rd2);color:var(--rd)}.pill.p{background:var(--p3);color:#c77dff}
.empty{text-align:center;color:var(--mu);padding:30px 18px;font-size:13.5px}
.empty b{display:block;color:#fff;margin-bottom:4px;font-size:15px}
.day{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:14px 16px 6px;background:var(--card)}
.acts{display:flex;gap:10px;overflow-x:auto;max-width:100%;padding:2px 0 4px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:650;text-align:center;color:var(--mu)}
.act i{width:56px;height:56px;border-radius:50%;background:var(--card2);color:#c77dff;display:grid;place-items:center}
.act:active i{background:var(--p3)}
.pixgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pixgrid .btn{flex-direction:column;min-height:70px;border-radius:14px;font-size:12.5px;gap:6px;padding:10px}
.chart{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--p2),var(--p));min-height:4px}
.chart .col span{font-size:10px;color:var(--mu);font-weight:700}
.bar2{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin:10px 0 6px}.bar2 span{display:block;height:100%;background:var(--p);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--mu)}.kv span:last-child{font-weight:650;text-align:right;color:#fff;overflow-wrap:anywhere}
.plastic{border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;aspect-ratio:1.6/1;max-height:230px;background:linear-gradient(135deg,#820ad1 0%,#4a0476 100%)}
.plastic::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.16) 0,transparent 40%);pointer-events:none}
.plastic .chipic{position:absolute;top:20px;left:20px;width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#d4af37,#f4d03f)}
.plastic .tp{position:absolute;top:22px;right:20px}
.plastic .num{position:absolute;left:20px;right:20px;bottom:44px;font-family:'Courier New',monospace;font-size:clamp(14px,4.6vw,19px);letter-spacing:.1em;font-weight:700;white-space:nowrap}
.plastic .foot{position:absolute;left:20px;right:20px;bottom:18px;display:flex;justify-content:space-between;font-size:12px;gap:8px}
.blocked{filter:grayscale(.85) brightness(.75)}
.chatscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.chatscroll::-webkit-scrollbar{display:none}
.msgrow{display:flex;gap:8px;align-items:flex-end}
.msgrow.me{justify-content:flex-end}
.mavatar{width:28px;height:28px;border-radius:50%;background:var(--p3);color:#c77dff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.bubble{max-width:78%;padding:10px 14px;border-radius:18px;border-bottom-left-radius:6px;font-size:14px;line-height:1.45;background:var(--card2);color:#fff;word-wrap:break-word}
.msgrow.me .bubble{background:var(--p);border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.mtime{font-size:10px;color:rgba(255,255,255,.55);margin-top:4px;text-align:right}
.composer{flex:none;display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + var(--bot));border-top:1px solid var(--ln);background:var(--bg)}
.composer input{flex:1;min-width:0;border:1.5px solid var(--ln);border-radius:999px;padding:12px 16px;background:var(--card2);color:#fff;outline:0;font-size:15px}
.composer input:focus{border-color:var(--p)}
.composer .send{width:46px;height:46px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;flex:none}
.composer .send:active{filter:brightness(.9)}
.tabs{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--ln);padding:8px 0 calc(8px + var(--bot));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:10.5px;font-weight:700;color:var(--mu)}
.tab.on{color:#c77dff}
.tab i{width:24px;height:24px}
.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;padding:0 18px calc(18px + var(--bot));box-shadow:0 -8px 24px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .25s ease-out;z-index:30;max-height:85%;overflow-y:auto;overscroll-behavior:contain}
.sheet.open{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--ln);margin:10px auto 14px}
.sheet h2{margin:0 0 14px;font-size:20px;letter-spacing:-.02em;color:#fff}
.sheet h3{color:#fff}

.code{background:#000;border:1.5px dashed var(--ln);border-radius:12px;padding:14px;font-family:'Courier New',monospace;font-size:12px;word-break:break-all;margin:14px 0;color:#fff}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.stat .b{background:var(--card);border-radius:12px;padding:14px;text-align:center}
.stat .b b{display:block;font-size:20px;font-weight:800;color:#c77dff;margin-bottom:4px}
.stat .b span{font-size:11px;color:var(--mu);font-weight:700}
.toast{position:fixed;top:calc(20px + var(--top));left:50%;transform:translateX(-50%) translateY(-120px);background:var(--card2);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.6);z-index:100;transition:transform .3s;max-width:calc(100% - 40px);border:1.5px solid var(--ln)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--gr);color:var(--gr)}
.toast.err{border-color:var(--rd);color:var(--rd)}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:200}
.busy i{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtBRL = (v) => Number(v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const fmtDate = (d) => new Date(d).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
const parseMoney = (s) => { const n = Number(String(s).replace(/\./g,'').replace(',','.')); return Number.isFinite(n) ? n : 0; };
const U = () => (S.st && S.st.user) || {};
const ini = () => ((U().fullName || U().username || '?')[0] || '?').toUpperCase();
const avatarHtml = (u, cls='av') => `<span class="${cls}">${u && u.avatarUrl ? `<img src="${esc(u.avatarUrl)}" alt="Foto de ${esc(u.fullName||u.username||'usuário')}" loading="lazy">` : esc(((u && (u.fullName||u.username)) || '?')[0].toUpperCase())}</span>`;
const fmtBalance = (u) => u && u.unlimitedFunds ? 'Ilimitado' : fmtBRL((u && u.balance) || 0);

const ICO = { home:'<path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/>', pix:'<path d="M9 5l-4 7 4 7M15 5l4 7-4 7"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>', pig:'<path d="M19 8c-2-2-5-3-8-3s-6 1-8 3c-1 1-1 3 0 4 2 2 5 3 8 3s6-1 8-3c1-1 1-3 0-4z"/><circle cx="8" cy="11" r="1" fill="currentColor"/>', credit:'<path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>', bell:'<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>', help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 0c0 2-2.5 3-2.5 3M12 17h.01"/>', chev:'<path d="M9 6l6 6-6 6"/>', back:'<path d="M19 12H5M12 19l-7-7 7-7"/>', arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M20 6L9 17l-5-5"/>', close:'<path d="M18 6L6 18M6 6l12 12"/>', copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>', trash:'<path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>', lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>', eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>', gift:'<path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>', logout:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>', refresh:'<path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>' };
const ico = (k) => `<svg class="i" viewBox="0 0 24 24">${ICO[k] || ''}</svg>`;

const S = { token: localStorage.getItem('armin_token') || '', st: null, master: null, products: [], vehicles: [], payments: null, page: 'home', homeMore: false, authTab: 'login', socket: null, card: null, cardTimer: null, pix: { key:'', rec:null, amount:'', value:0, note:'', n:1 }, toastTimer: null, sheetEl: null };

async function api(p, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.token) headers.authorization = `Bearer ${S.token}`;
  const r = await fetch(p, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : null });
  const j = await r.json().catch(() => null);
  if (!r.ok) { if (r.status === 401 && S.token) { localStorage.removeItem('armin_token'); S.token=''; S.st=null; S.master=null; render(); toast('Sua sessão foi invalidada. Entre novamente para continuar.', 'err'); } throw new Error((j && j.message) || 'Erro na requisição'); }
  return j;
}
async function uploadFile(file) {
  if (!file) throw new Error('Selecione uma imagem primeiro.');
  if (!file.type.startsWith('image/')) throw new Error('Selecione um arquivo de imagem válido.');
  if (file.size > 32 * 1024 * 1024) throw new Error('A imagem deve ter no máximo 32MB.');
  const form = new FormData(); form.append('image', file);
  const headers = {}; if (S.token) headers.authorization = `Bearer ${S.token}`;
  const r = await fetch('/api/upload/image', { method:'POST', headers, body:form });
  const j = await r.json().catch(() => null); if (!r.ok) throw new Error((j && j.message) || 'Erro ao enviar imagem.'); return j;
}
async function busy(el, fn) {
  if (el) el.disabled = true;
  const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = '<i></i>'; document.body.appendChild(b);
  try { return await fn(); } catch (e) { toast(e.message, 'err'); return null; } finally { document.body.removeChild(b); if (el) el.disabled = false; }
}
function toast(msg, type = '') {
  clearTimeout(S.toastTimer);
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.className = `toast show ${type}`; t.textContent = msg;
  S.toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);
}
function sheetOpen(html) {
  sheetClose();
  const s = document.createElement('div'); s.className = 'sheet open';
  s.innerHTML = `<div class="grip"></div><button class="close" data-act="closeSheet">${ico('close')}</button>${html}`;
  $('#root').appendChild(s); S.sheetEl = s; return s;
}
function sheetClose() { if (S.sheetEl) { S.sheetEl.remove(); S.sheetEl = null; } }
function setState(r) { if (r && r.state) S.st = r.state; render(); }
async function loadMaster() { try { const m = await api('/api/master/overview'); S.master = m; render(); } catch (e) { toast(e.message, 'err'); } }
async function loadShop() { try { const [p, pay] = await Promise.all([api('/api/products'), api('/api/payments')]); S.products = p.products || []; S.payments = pay; render(); } catch (e) { toast(e.message, 'err'); } }

function chartHtml(title, txs, kinds) {
  const pos = kinds.includes('savings_yield') || kinds.includes('referral');
  const buckets = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); buckets.push({ label:'DSTQQSS'[d.getDay()], key:d.toDateString(), total:0 }); }
  (txs||[]).forEach(t => {
    if (!kinds.includes(t.kind||'')) return;
    if (pos ? (t.amount||0) <= 0 : (t.amount||0) >= 0) return;
    const k = new Date(t.createdAt); k.setHours(0,0,0,0);
    const b = buckets.find(x => x.key === k.toDateString()); if (b) b.total += Math.abs(t.amount||0);
  });
  const max = Math.max(...buckets.map(b => b.total), 1);
  const total = buckets.reduce((s,b) => s+b.total, 0);
  return `<div class="ttl"><h3>${title}</h3><span class="pill p">${fmtBRL(total)}</span></div>
  <div class="chart">${buckets.map(b => `<div class="col"><div class="bar" style="height:${Math.max(4, Math.round((b.total/max)*100))}%"></div><span>${b.label}</span></div>`).join('')}</div>`;
}

function shell() { return `<div class="app"><div id="view" class="view"></div><nav class="tabs" id="tabs"></nav></div>`; }
function render() {
  sheetClose();
  if (!S.token || !S.st) { renderAuth(); return; }
  $('#root').innerHTML = shell();
  $('#tabs').innerHTML = tabsHtml();
  const v = $('#view');
  v.style.cssText = (S.page === 'support') ? 'display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(66px + var(--bot))' : '';
  if (S.page === 'master' && U().role === 'admin') renderMaster();
  else if (S.page === 'support') renderSupport();
  else if (S.page === 'pixhub') renderPixHub();
  else if (S.page === 'savings') renderSavings();
  else if (S.page === 'pix') renderExtract();
  else if (S.page === 'card') renderCardPage();
  else if (S.page === 'shop') renderShop();
  else if (S.page === 'more') renderMore();
  else renderHome();
}
function tabsHtml() {
  return [ {id:'home',l:'Início',i:'home'}, {id:'pix',l:'Extrato',i:'list'}, {id:'card',l:'Cartão',i:'card'}, {id:'more',l:'Mais',i:'plus'} ]
    .map(t => `<button class="tab ${S.page===t.id?'on':''}" data-act="goPage" data-page="${t.id}">${ico(t.i)}${t.l}</button>`).join('');
}
function renderAuth() {
  const tab = S.authTab;
  $('#root').innerHTML = `
  <div class="auth">
    <div class="logo"><b>G</b> GHSOTBANK</div>
    <h1>Seu banco digital<br>sem complicação</h1>
    <p>Pix, cartão, cofrinho e crédito em um só lugar.</p>
    <div class="seg">
      <button class="${tab==='login'?'on':''}" data-act="switchAuth" data-tab="login">Entrar</button>
      <button class="${tab==='register'?'on':''}" data-act="switchAuth" data-tab="register">Criar conta</button>
    </div>
    ${tab === 'login' ? `
      <form data-form="login">
        <div class="fld"><label>Usuário ou e-mail</label><input name="username" required autocomplete="username"></div>
        <div class="fld"><label>Senha</label><input name="password" type="password" required autocomplete="current-password"></div>
        <button class="btn" type="submit">${ico('arrow')} Entrar</button>
      </form>` : `
      <form data-form="register">
        <div class="fld"><label>Nome completo</label><input name="fullName" required placeholder="Nome e sobrenome"></div>
        <div class="fld"><label>Usuário</label><input name="username" required pattern="[a-zA-Z0-9_]+" placeholder="só letras, números e _"><small>Sem espaços nem acentos</small></div>
        <div class="fld"><label>Senha</label><input name="password" type="password" required minlength="4" placeholder="mínimo 4 caracteres"></div>
        <button class="btn" type="submit">${ico('check')} Criar conta grátis</button>
      </form>`}
    <div class="demo"><p>Contas de demonstração:</p>
      <button data-act="demoLogin" data-u="aventureiro" data-p="1234">Lia (user)</button>
      <button data-act="demoLogin" data-u="master" data-p="master">Armin (admin)</button>
    </div>
  </div>`;
}
function txRow(tx) {
  const isIn = (tx.amount || 0) >= 0;
  const icon = (tx.kind||'').includes('pix') ? 'pix' : tx.kind === 'card' ? 'card' : (tx.kind === 'savings_yield' || tx.kind === 'savings') ? 'pig' : tx.kind === 'installment' ? 'credit' : tx.kind === 'referral' ? 'gift' : tx.kind === 'deposit' ? 'bonus' : 'arrow';
  return `<div class="row"><div class="ic ${isIn?'g':'r'}">${ico(icon)}</div><div class="mid"><b>${esc(tx.description || tx.title || 'Movimentação')}</b><span>${fmtDate(tx.createdAt)}</span></div><div class="end ${isIn?'in':'out'}">${isIn?'+':'-'}${fmtBRL(Math.abs(tx.amount))}</div></div>`;
}
function renderHome() {
  const u = U(); const txs = (S.st.transactions || []).slice(0, 4); const unread = S.st.unread || 0;
  const shortcut = (act, ic, label, sub, extra='') => `<button class="shortcut" data-act="${act}" ${extra}><span class="shortcut-icon">${ico(ic)}</span><b>${label}</b><span>${sub}</span></button>`;
  const quick = `${shortcut('openPixHub','pix','Área Pix','Enviar e cobrar')}${shortcut('goPage','pig','Cofrinho','Guardar dinheiro','data-page="savings"')}${shortcut('openCard','card','Cartão Black','Ver cartão')}${shortcut('openContracts','credit','Contratar','Seguro e veículos')}${shortcut('openShop','gift','Loja','Itens e moedas')}`;
  const more = `${shortcut('openScore','check','Meu score','Ver pontuação')}${shortcut('openCredit','credit','Crédito','Fatura e limite')}${shortcut('openLoans','credit','Empréstimos','Solicitar e pagar')}${shortcut('openReferral','gift','Indique','Ganhe bônus')}${shortcut('openKeys','lock','Chaves Pix','Gerenciar')}${shortcut('openCharge','plus','Cobrar','Criar cobrança')}${shortcut('openNotifs','bell','Avisos',unread ? `${unread} não lidos` : 'Tudo em dia')}${shortcut('openSupport','help','Suporte','Fale com a gente')}${shortcut('openPassword','lock','Segurança','Trocar senha')}${u.role==='admin' ? shortcut('goPage','check','Painel master','Gerenciar','data-page="master"') : shortcut('goPage','list','Extrato','Ver movimentos','data-page="pix"')}`;
  $('#view').innerHTML = `
  <div class="hdr" style="padding-bottom:10px"><div class="bar"><button class="profile-button" data-act="openProfile" aria-label="Abrir meu perfil">${avatarHtml(u)}</button><div class="tools"><button class="ib" data-act="openNotifs">${ico('bell')}${unread ? `<span class="dot">${unread}</span>` : ''}</button><button class="ib" data-act="openSupport">${ico('help')}</button><button class="ib" data-act="logout">${ico('logout')}</button></div></div></div>
  <div class="wrap" style="padding-top:6px">
  <div class="home-hero"><span class="eyebrow">Sua conta Ghsot</span><h1 style="margin:8px 0 0;font-size:23px">Olá, ${esc((u.fullName||u.username||'').split(' ')[0])}</h1><p>Saldo disponível</p><div class="balance">${fmtBalance(u)}</div><div class="hero-actions"><button data-act="openPix">${ico('arrow')} Enviar Pix</button><button data-act="openShop">${ico('gift')} Explorar loja</button></div></div>
    <div class="quick-title"><div><h2>Atalhos rápidos</h2><p style="margin:3px 0 0;color:var(--mu);font-size:12px">Suas principais funções</p></div><button class="more-toggle ${S.homeMore?'open':''}" data-act="toggleHomeMenu" aria-label="${S.homeMore?'Fechar':'Abrir'} menu completo">${ico('plus')}</button></div>
    <div class="shortcut-grid">${quick}</div>
    <div class="home-menu ${S.homeMore?'open':''}"><div class="home-menu-inner"><div class="shortcut-grid">${more}</div></div></div>
    <div class="card"><div class="section-head" style="margin:0 0 10px"><div><h2>Para você</h2><p>Seu dinheiro trabalhando melhor</p></div></div><div class="row" style="border-radius:14px;padding:13px 0;background:transparent;border-bottom:0" data-act="openScore"><div class="ic">${ico('check')}</div><div class="mid"><b>Seu score ${S.st.score ? S.st.score.value : u.score}</b><span>${S.st.score ? S.st.score.band : 'Veja como melhorar seu crédito'}</span></div>${ico('chev')}</div><div class="row" style="border-radius:14px;padding:13px 0;background:transparent;border-bottom:0" data-act="openCard"><div class="ic">${ico('card')}</div><div class="mid"><b>Seu cartão Black</b><span>Toque para ver número, validade e limite</span></div>${ico('chev')}</div><div class="row" style="border-radius:14px;padding:13px 0;background:transparent;border-bottom:0" data-act="openContracts"><div class="ic">${ico('credit')}</div><div class="mid"><b>Seguro e veículos</b><span>Contrate proteção ou financie seu carro</span></div>${ico('chev')}</div><div class="row" style="border-radius:14px;padding:13px 0;background:transparent;border-bottom:0" data-act="openShop"><div class="ic">${ico('gift')}</div><div class="mid"><b>Descubra a loja de itens</b><span>Compre com reais, vale ou moedas mágicas</span></div>${ico('chev')}</div></div>
    ${(u.savings||0) > 0 ? `<button class="card" style="width:100%;text-align:left" data-act="goPage" data-page="savings"><div class="ttl"><h3>Cofrinho</h3><span class="pill g">rendendo</span></div><div class="big">${fmtBRL(u.savings)}</div><p class="mu sm-t">Toque para acompanhar o rendimento</p></button>` : ''}
    <div class="card flush"><div class="ttl" style="padding:16px 16px 0"><h3>Últimas movimentações</h3><button class="lnk" data-act="goPage" data-page="pix">Ver tudo</button></div>${txs.length ? txs.map(txRow).join('') : '<div class="empty"><b>Nada por aqui ainda</b>Suas movimentações aparecem aqui.</div>'}</div>
  </div>`;
}
function renderSavings() {
  const u = U(); const yields = (S.st.transactions || []).filter(t => t.kind === 'savings_yield');
  const gained = yields.reduce((s,t) => s + Math.abs(t.amount||0), 0);
  $('#view').innerHTML = `
  <div class="hdr"><div class="bar"><button class="ib" data-act="goPage" data-page="home">${ico('back')}</button><div class="tools"><span class="pill g">rendendo</span></div></div>
    <h1>Cofrinho</h1><p>Guardado e rendendo ~1% ao mês</p></div>
  <div class="wrap">
    <div class="card"><div class="big">${fmtBRL(u.savings||0)}</div>
      <div class="kv"><span>Rendimento acumulado</span><span class="in">+${fmtBRL(gained)}</span></div>
      <div class="kv"><span>Projeção p/ próximo mês</span><span>${fmtBRL((u.savings||0)*1.01)}</span></div>
      <div class="btns two"><button class="btn" data-act="openSavings">${ico('pig')} Guardar</button><button class="btn sec" data-act="openSavings">Resgatar</button></div></div>
    <div class="card">${chartHtml('Rendimento por dia', S.st.transactions || [], ['savings_yield'])}</div>
    <div class="card flush"><div class="ttl" style="padding:16px 16px 0"><h3>Histórico de rendimento</h3></div>
      ${yields.length ? yields.slice(0,8).map(txRow).join('') : '<div class="empty"><b>Sem rendimentos ainda</b>Guarde dinheiro para começar a render.</div>'}</div>
  </div>`;
}
function msgRow(m) {
  const me = m.role !== 'support';
  return `<div class="msgrow ${me?'me':'them'}">
    ${me ? '' : `<div class="mavatar">A</div>`}
    <div class="bubble"><div class="mtext">${esc(m.text)}</div><div class="mtime">${fmtDate(m.createdAt)}</div></div>
  </div>`;
}
function scrollChat(root) { const w = (root || document).querySelector('.chatscroll'); if (w) w.scrollTop = w.scrollHeight; }
function renderSupport() {
  const msgs = S.st.supportMessages || [];
  $('#view').innerHTML = `
  <div class="hdr" style="padding-bottom:14px">
    <div class="bar"><button class="ib" data-act="goPage" data-page="home">${ico('back')}</button>
      <div class="tools"><span class="pill g">online</span></div></div>
    <h1 style="font-size:22px;margin-top:6px">Suporte Ghsot</h1>
    <p>A gente responde por aqui, em tempo real</p>
  </div>
  <div class="chatscroll">
    ${msgs.length ? msgs.map(msgRow).join('') : '<div class="empty"><b>Nenhuma mensagem ainda</b>Mande um oi que a conversa começa.</div>'}
  </div>
  <form class="composer" data-form="support">
    <input name="text" placeholder="Escreva sua mensagem" autocomplete="off">
    <button class="send" type="submit" aria-label="Enviar">${ico('arrow')}</button>
  </form>`;
  scrollChat();
}
function renderPixHub() {
  const u = U(); const pixTx = (S.st.transactions || []).filter(t => (t.kind||'').includes('pix')).slice(0, 6);
  $('#view').innerHTML = `
  <div class="hdr"><div class="bar"><div class="av">${ini()}</div><div class="tools"><button class="ib" data-act="openKeys">${ico('plus')}</button></div></div>
    <h1>Área Pix</h1><p>Envie, receba e gerencie chaves</p></div>
  <div class="wrap">
    <div class="card"><div class="pixgrid">
      <button class="btn" data-act="openPix">${ico('arrow')}<span>Enviar Pix</span></button>
      <button class="btn sec" data-act="openCharge">${ico('plus')}<span>Cobrar</span></button>
      <button class="btn sec" data-act="pasteCode">${ico('copy')}<span>Colar código</span></button>
      <button class="btn sec" data-act="openKeys">${ico('lock')}<span>Minhas chaves</span></button>
    </div></div>
    <div class="card flush"><div class="ttl" style="padding:16px 16px 0"><h3>Minhas chaves Pix</h3><button class="lnk" data-act="openKeys">Criar nova</button></div>
      ${(u.pixKeys||[]).map(k => `<div class="row"><div class="ic">${ico('pix')}</div><div class="mid"><b>${esc(k.value)}</b><span>${esc(k.type)}</span></div><button class="btn sm dng" data-act="removeKey" data-id="${esc(k.id)}">${ico('trash')}</button></div>`).join('') || '<div class="empty">Nenhuma chave.</div>'}
    </div>
    <div class="card flush"><div class="ttl" style="padding:16px 16px 0"><h3>Últimos Pix</h3></div>
      ${pixTx.length ? pixTx.map(txRow).join('') : '<div class="empty"><b>Nenhum Pix ainda</b>Envie ou receba o primeiro.</div>'}</div>
  </div>`;
}
function renderExtract() {
  const txs = S.st.transactions || []; let last = '';
  $('#view').innerHTML = `
  <div class="hdr"><div class="bar"><div class="av">${ini()}</div><div class="tools"><button class="ib" data-act="goPage" data-page="home">${ico('close')}</button></div></div><h1>Extrato</h1><p>${txs.length} movimentações</p></div>
  <div class="wrap">
    <div class="card">${chartHtml('Gastos nos últimos 7 dias', txs, ['pix_out','card','installment'])}</div>
    <div class="card flush">${txs.length ? txs.map(t => { const d = new Date(t.createdAt).toLocaleDateString('pt-BR'); const h = d !== last ? `<div class="day">${d}</div>` : ''; last = d; return h + txRow(t); }).join('') : '<div class="empty"><b>Nada por aqui ainda</b></div>'}</div>
  </div>`;
}
function renderCardPage() {

  unbanUser: async (el) => { const r = await busy(el, () => api(`/api/master/users/${encodeURIComponent(el.dataset.id)}/ban`, { method:'POST', body:{ banned:false, note:'Conta reativada pelo master.' } })); if (r) { sheetClose(); toast('Usuário reativado.', 'ok'); loadMaster(); } },
  promoteUser: async (el) => { const r = await busy(el, () => api(`/api/master/users/${encodeURIComponent(el.dataset.id)}/role`, { method:'POST', body:{ role:'seller' } })); if (r) { sheetClose(); toast('Usuário promovido a vendedor.', 'ok'); loadMaster(); } },
  demoteUser: async (el) => { const r = await busy(el, () => api(`/api/master/users/${encodeURIComponent(el.dataset.id)}/role`, { method:'POST', body:{ role:'user' } })); if (r) { sheetClose(); toast('Permissão de vendedor removida.', 'ok'); loadMaster(); } },
  openWalletAdmin: (el) => openWalletAdmin(el.dataset.id),
  refreshMaster: () => loadMaster(),
};

/* ---------- formulários ---------- */
const F = {
  profileName: async (f, ev) => { const fullName = String(new FormData(f).get('fullName') || '').trim(); const r = await busy(ev.submitter, () => api('/api/profile/name', { method:'POST', body:{ fullName } })); if (r) { setState(r); sheetClose(); toast('Nome atualizado!', 'ok'); } },
  login: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/login', { method:'POST', body:{ username:d.username, password:d.password } })); if (r) { enter(r); toast(`Olá, ${((r.state&&r.state.user&&r.state.user.fullName)||'').split(' ')[0] || 'bem-vindo'}!`, 'ok'); } },
  register: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/register', { method:'POST', body:d })); if (r) { enter(r); toast('Conta criada! Bem-vindo(a).', 'ok'); } },
  referral: async (f, ev) => { const code = new FormData(f).get('code'); const r = await busy(ev.submitter, () => api('/api/referral/apply', { method:'POST', body:{ code } })); if (r) { setState(r); openReferral(); toast(`Você ganhou ${fmtBRL(r.reward)} com o código!`, 'ok'); } },
  pixLookup: async (f, ev) => { const key = new FormData(f).get('key'); const r = await busy(ev.submitter, () => api('/api/pix/lookup', { method:'POST', body:{ key } })); if (r) { S.pix = { ...S.pix, key:r.key || key, rec:r.recipient, amount:r.amount > 0 ? String(r.amount) : '' }; pixStep2(); } },
  pixReview: (f) => {
    const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); const n = parseInt(d.installments, 10) || 1;
    if (!(v > 0)) return toast('Digite um valor válido.', 'err');
    if (!U().unlimitedFunds && n > 1) { if (v > ((U().creditLimit||0) - (U().creditUsed||0))) return toast('Limite do cartão insuficiente para parcelar.', 'err'); }
    else if (!U().unlimitedFunds && v > U().balance) return toast('Saldo insuficiente para este Pix.', 'err');
    S.pix.value = v; S.pix.amount = d.amount; S.pix.note = (d.note||'').trim(); S.pix.n = n; pixStep3();
  },
  addKey: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/pix/key', { method:'POST', body:d })); if (r) { setState(r); openKeys(); toast('Chave cadastrada!', 'ok'); } },
  charge: (f) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); const hasV = String(d.amount||'').trim() !== ''; if (hasV && !(v > 0)) return toast('Valor inválido.', 'err'); const code = `ZKPIX|${d.key}|${hasV ? v.toFixed(2) : '0'}`; $('#chargeOut').innerHTML = `<div class="code">${esc(code)}</div><div class="btns"><button class="btn" data-act="copyCode" data-v="${esc(code)}">${ico('copy')} Copiar código</button></div><p class="mu sm-t">Quem paga cola em Pix → Colar código.</p>`; },
  savings: async (f, ev) => { const v = parseMoney(new FormData(f).get('amount')); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const dir = (ev.submitter && ev.submitter.dataset.dir) || 'in'; const r = await busy(ev.submitter, () => api(`/api/savings/${dir}`, { method:'POST', body:{ amount:v } })); if (r) { setState(r); openSavings(); toast(dir === 'in' ? 'Guardado com sucesso!' : 'Resgate feito — dinheiro na conta.', 'ok'); } },
  invoice: async (f, ev) => { const v = parseMoney(new FormData(f).get('amount')); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/credit/pay', { method:'POST', body:{ amount:v } })); if (r) { setState(r); sheetClose(); toast('Fatura paga!', 'ok'); } },
  draw: async (f, ev) => { const v = parseMoney(new FormData(f).get('amount')); if (!(v >= 10)) return toast('O valor mínimo é R$ 10,00.', 'err'); const r = await busy(ev.submitter, () => api('/api/credit/draw', { method:'POST', body:{ amount:v } })); if (r) { setState(r); sheetClose(); toast(`${fmtBRL(v)} na sua conta!`, 'ok'); } },
  purchase: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/card/purchase', { method:'POST', body:{ merchant:d.merchant, amount:v } })); if (r) { setState(r); sheetClose(); toast('Compra aprovada!', 'ok'); } },
  creditReq: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v >= 50)) return toast('Peça pelo menos R$ 50,00.', 'err'); const r = await busy(ev.submitter, () => api('/api/credit/request', { method:'POST', body:{ amount:v, purpose:d.purpose } })); if (r) { setState(r); openCreditReq(); toast(r.message, 'ok'); } },
  loanRequest: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); d.amount = parseMoney(d.amount); const r = await busy(ev.submitter, () => api('/api/loans/request', { method:'POST', body:d })); if (r) { setState(r); openLoans(); toast(r.message, 'ok'); } },
  lifeInsurance: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/insurance/life', { method:'POST', body:d })); if (r) { setState(r); openContracts(); toast(r.message, 'ok'); } },
  vehicleFinance: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); d.downPayment = parseMoney(d.downPayment); const r = await busy(ev.submitter, () => api(`/api/vehicles/${encodeURIComponent(d.vehicleId)}/finance`, { method:'POST', body:d })); if (r) { setState(r); openContracts(); toast(r.message, 'ok'); } },
  vehicleAdmin: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); d.price = parseMoney(d.price); const r = await busy(ev.submitter, async () => { const up = await uploadFile(f.elements.image.files[0]); d.imageUrl = up.url; delete d.image; return api('/api/master/vehicles', { method:'POST', body:d }); }); if (r) { sheetClose(); toast('Veículo publicado com foto.', 'ok'); } },
  password: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/password', { method:'POST', body:d })); if (r) { S.token = r.token; localStorage.setItem('armin_token', r.token); connectSocket(); setState(r); sheetClose(); toast('Senha alterada!', 'ok'); } },
  support: async (f, ev) => { const t = String(new FormData(f).get('text') || '').trim(); if (!t) return; const r = await busy(ev.submitter, () => api('/api/support/messages', { method:'POST', body:{ text:t } })); if (r) setState(r); },
  reply: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); if (!String(d.text).trim()) return; const r = await busy(ev.submitter, () => api('/api/master/support/reply', { method:'POST', body:d })); if (r) { await loadMaster(); openThread(d.userId); } },
  deposit: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/master/deposit', { method:'POST', body:{ userId:d.userId, amount:v, note:d.note } })); if (r) { sheetClose(); toast('Depósito feito.', 'ok'); loadMaster(); } },
  masterBalance: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); d.amount = parseMoney(d.amount); if (!d.amount) return toast('Informe um valor diferente de zero.', 'err'); const r = await busy(ev.submitter, () => api(`/api/master/users/${encodeURIComponent(d.userId)}/balance`, { method:'POST', body:{ amount:d.amount, note:d.note } })); if (r) { sheetClose(); toast('Saldo atualizado.', 'ok'); loadMaster(); } },
  masterCredit: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); d.limit = parseMoney(d.limit); const r = await busy(ev.submitter, () => api(`/api/master/users/${encodeURIComponent(d.userId)}/credit-limit`, { method:'POST', body:{ limit:d.limit, note:d.note } })); if (r) { sheetClose(); toast('Limite de crédito atualizado.', 'ok'); loadMaster(); } },
  masterWallet: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); d.amount = parseMoney(d.amount); if (!d.amount) return toast('Informe uma quantidade diferente de zero.', 'err'); const r = await busy(ev.submitter, () => api(`/api/master/users/${encodeURIComponent(d.userId)}/wallet`, { method:'POST', body:{ wallet:d.wallet, amount:d.amount, note:d.note } })); if (r) { sheetClose(); toast('Carteira atualizada.', 'ok'); loadMaster(); } },
  avatar: async (f, ev) => { const r = await busy(ev.submitter, async () => { const up = await uploadFile(f.elements.image.files[0]); return api('/api/profile/avatar', { method:'POST', body:{ avatarUrl:up.url } }); }); if (r) { setState(r); sheetClose(); toast('Foto de perfil atualizada!', 'ok'); } },
  product: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); d.price = parseMoney(d.price); const r = await busy(ev.submitter, async () => { const up = await uploadFile(f.elements.image.files[0]); delete d.image; d.imageUrl = up.url; return api('/api/products', { method:'POST', body:d }); }); if (r) { sheetClose(); toast('Produto publicado com imagem!', 'ok'); S.payments = null; loadShop(); } },
  productEdit: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); d.price = parseMoney(d.price); const r = await busy(ev.submitter, async () => { if (f.elements.image.files[0]) d.imageUrl = (await uploadFile(f.elements.image.files[0])).url; delete d.image; return api(`/api/products/${encodeURIComponent(d.productId)}`, { method:'PUT', body:d }); }); if (r) { sheetClose(); toast('Produto atualizado.', 'ok'); S.payments = null; loadShop(); } },
  buy: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api(`/api/products/${encodeURIComponent(d.productId)}/purchase`, { method:'POST', body:{ method:d.method } })); if (r) { setState(r); sheetClose(); toast('Compra aprovada!', 'ok'); S.payments = null; loadShop(); } },
  autoDebit: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); d.enabled = f.elements.enabled.checked; d.amount = parseMoney(d.amount); const r = await busy(ev.submitter, () => api('/api/payments/auto-debit', { method:'POST', body:d })); if (r) { setState(r); sheetClose(); toast('Débito automático atualizado.', 'ok'); S.payments = null; loadShop(); } },
};
const CH = { keyType: (el) => { const w = $('#kvWrap'); if (w) w.classList.toggle('hidden', el.value === 'aleatória'); const k = $('#kv'); if (k) { k.required = el.value !== 'aleatória'; k.placeholder = { cpf:'000.000.000-00', cnpj:'00.000.000/0000-00', email:'voce@email.com', telefone:'(11) 91234-5678' }[el.value] || ''; } } };

/* ---------- sessão / tempo real ---------- */
function enter(r) { S.token = r.token; localStorage.setItem('armin_token', S.token); S.st = r.state; S.page = 'home'; S.master = null; render(); connectSocket(); }
function doLocalLogout() { localStorage.removeItem('armin_token'); S.token = ''; S.st = null; S.master = null; S.card = null; S.page = 'home'; S.authTab = 'login'; if (S.socket) { S.socket.disconnect(); S.socket = null; } render(); }
function connectSocket() {
  if (S.socket) { S.socket.disconnect(); S.socket = null; }
  if (typeof io === 'undefined' || !S.token) return;
  S.socket = io({ auth: { token: S.token }, reconnectionDelayMax: 8000 });
  S.socket.on('account:updated', (p) => { if (p.state) { S.st = p.state; render(); } });
  S.socket.on('master:refresh', () => { if (S.page === 'master') loadMaster(); });
}
async function poll() { if (!S.token || !S.st || document.hidden) return; try { const r = await api('/api/me'); if (JSON.stringify(r.state) !== JSON.stringify(S.st)) { S.st = r.state; render(); } } catch (e) {} }

document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = A[el.dataset.act]; if (!fn) return; e.preventDefault(); fn(el, e); });
document.addEventListener('submit', (e) => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = F[f.dataset.form]; if (fn) fn(f, e); });
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CH[el.dataset.change]) CH[el.dataset.change](el); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') sheetClose(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
setInterval(poll, 25000);

$('#root').innerHTML = shell();
(async function boot() {
  render();
  if (!S.token) return;
  try { const r = await api('/api/me'); S.st = r.state; render(); connectSocket(); }
  catch (e) { localStorage.removeItem('armin_token'); S.token = ''; S.st = null; render(); }
  })();
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
