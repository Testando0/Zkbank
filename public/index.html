<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Armin Bank — conta digital com Pix, cartão, cofrinho e crédito." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<title>Armin Bank</title>
<style>
:root{--p:#820ad1;--p2:#6a07ae;--p3:#f3e8fb;--bg:#1a1a1a;--card:#2d2d2d;--tx:#ffffff;--mu:#a0a0a0;--ln:#404040;--gr:#0e9f6e;--gr2:#1a4d3a;--rd:#d6334f;--rd2:#4d1f2a;--am:#b7791f;--am2:#4d3d1f;--r:16px;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:disabled{opacity:.55;cursor:default}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#root{height:100%;max-width:480px;margin:0 auto;position:relative;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.04)}
@media(min-width:520px){body{background:#0d0d0d}#root{height:min(100%,900px);margin-top:max(0px,calc((100vh - 900px)/2));overflow:hidden;border-radius:20px}}

/* ---------- login ---------- */
.auth{height:100%;overflow-y:auto;background:linear-gradient(135deg,#820ad1 0%,#6a07ae 100%);color:#fff;padding:calc(36px + var(--top)) 24px calc(28px + var(--bot));display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:15px}
.logo b{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;font-size:19px;letter-spacing:0}
.auth h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:44px 0 8px}
.auth>p{margin:0 0 24px;opacity:.85}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.16);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{padding:10px;border-radius:9px;font-weight:700;color:rgba(255,255,255,.85)}
.seg button.on{background:#fff;color:var(--p)}
.auth .fld label{color:rgba(255,255,255,.9)}
.auth input{background:#fff;color:#1a1a1a}
.auth .btn{background:#fff;color:var(--p);margin-top:8px}
.demo{margin-top:auto;padding-top:26px;font-size:12px;opacity:.9;text-align:center}
.demo button{display:inline-block;margin:6px 4px 0;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:12px}

/* ---------- campos e botões ---------- */
.fld{margin:0 0 14px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:14px;background:#2d2d2d;color:var(--tx);outline:0;font-size:16px;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(130,10,209,.3)}
.fld textarea{min-height:88px;resize:none}
.fld small{display:block;color:var(--mu);margin-top:5px;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:999px;background:var(--p);color:#fff;font-weight:700;font-size:15.5px;padding:0 22px}
.btn:active:not(:disabled){filter:brightness(.92)}
.btn.sec{background:#3d3d3d;color:var(--p)}
.btn.out{background:#2d2d2d;color:var(--p);border:1.5px solid var(--p)}
.btn.dng{background:var(--rd2);color:var(--rd)}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 16px;width:auto}
.btns{display:grid;gap:10px;margin-top:6px}
.btns.two{grid-template-columns:1fr 1fr}
.lnk{color:var(--p);font-weight:700;font-size:13.5px}

/* ---------- estrutura ---------- */
.app{height:100%;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(84px + var(--bot))}
.view.sub{padding-bottom:calc(24px + var(--bot))}
.hdr{background:var(--p);color:#fff;padding:calc(14px + var(--top)) 18px 22px}
.hdr.tall{padding-bottom:30px}
.hdr .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.hdr .tools{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:inherit;position:relative}
.ib:active{background:rgba(255,255,255,.15)}
.hdr h1{margin:10px 0 0;font-size:26px;letter-spacing:-.03em;line-height:1.15}
.hdr p{margin:4px 0 0;opacity:.85;font-size:13.5px}
.av{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.dot{position:absolute;top:7px;right:7px;min-width:17px;height:17px;border-radius:9px;background:#ff4d6d;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--p)}
.wrap{padding:14px 14px 0;display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.card.flush{padding:0;overflow:hidden}
.ttl{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.ttl h3{margin:0;font-size:15px}
.mu{color:var(--mu)}.sm-t{font-size:12.5px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--ln);background:#2d2d2d}
.row:last-child{border-bottom:0}
button.row:active{background:#3a3a3a}
.row .ic{width:40px;height:40px;border-radius:50%;background:var(--p3);color:var(--p);display:grid;place-items:center;flex:none}
.row .ic.g{background:var(--gr2);color:var(--gr)}.row .ic.r{background:var(--rd2);color:var(--rd)}.row .ic.a{background:var(--am2);color:var(--am)}.row .ic.n{background:#4d4d4d;color:#a0a0a0}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid span{display:block;font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:right;font-weight:700;font-size:14.5px;flex:none;max-width:44%}
.row .end small{display:block;font-weight:500;font-size:11.5px;color:var(--mu)}
.in{color:var(--gr)}.out{color:var(--tx)}
.chev{color:#6b6b6b;width:20px;height:20px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#4d4d4d;color:#a0a0a0}
.pill.g{background:var(--gr2);color:var(--gr)}.pill.a{background:var(--am2);color:var(--am)}.pill.r{background:var(--rd2);color:var(--rd)}.pill.p{background:var(--p3);color:var(--p)}
.empty{text-align:center;color:var(--mu);padding:30px 18px;font-size:13.5px}
.empty b{display:block;color:var(--tx);margin-bottom:4px;font-size:15px}
.day{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:14px 16px 6px;background:var(--bg)}
.acts{display:flex;gap:10px;overflow-x:auto;padding:2px 14px 4px;margin:0 -14px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:650;text-align:center}
.act i{width:58px;height:58px;border-radius:50%;background:#2d2d2d;color:var(--p);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.act:active i{background:var(--p3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#2d2d2d;font-weight:700;font-size:13px;color:#a0a0a0;border:1.5px solid transparent}
.chip.on{background:var(--p3);color:var(--p);border-color:var(--p)}
.people{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}.people::-webkit-scrollbar{display:none}
.ppl{flex:0 0 64px;text-align:center;font-size:12px;font-weight:600}
.ppl i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 5px;border-radius:50%;background:var(--p3);color:var(--p);font-style:normal;font-weight:800}
.ppl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar2{height:8px;border-radius:99px;background:#4d4d4d;overflow:hidden;margin:10px 0 6px}.bar2 span{display:block;height:100%;background:var(--p);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--mu)}.kv span:last-child{font-weight:650;text-align:right;overflow-wrap:anywhere}

/* ---------- cartão ---------- */
.plastic{border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;aspect-ratio:1.6/1;background:linear-gradient(135deg,#820ad1 0%,#6a07ae 100%)}
.plastic::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.15) 0,transparent 40%);pointer-events:none}
.plastic .tp{position:absolute;top:20px;right:20px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.plastic .chip{position:absolute;top:20px;left:20px;width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#d4af37 0%,#f4d03f 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.plastic .num{position:absolute;left:20px;right:20px;bottom:44px;font-family:'Courier New',monospace;font-size:19px;letter-spacing:.12em;font-weight:700}
.plastic .foot{position:absolute;left:20px;right:20px;bottom:20px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.plastic .brand{font-weight:800;letter-spacing:.05em;font-size:14px}
.blocked{filter:grayscale(.8) brightness(.8)}

/* ---------- navegação inferior ---------- */
.tabs{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#2d2d2d;border-top:1px solid var(--ln);padding:8px 0 calc(8px + var(--bot))}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:700;color:var(--mu)}
.tab.on{color:var(--p)}
.tab i{width:26px;height:26px}

/* ---------- sheets ---------- */
.sheet{position:absolute;bottom:0;left:0;right:0;background:#2d2d2d;border-radius:20px 20px 0 0;padding:0 18px calc(18px + var(--bot));box-shadow:0 -8px 24px rgba(0,0,0,.4);transform:translateY(100%);transition:transform .25s ease-out;z-index:10;max-height:85%;overflow-y:auto}
.sheet.open{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:#4d4d4d;margin:10px auto 14px}
.sheet h2{margin:0 0 14px;font-size:20px;letter-spacing:-.02em}
.sheet .close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:#4d4d4d;display:grid;place-items:center;color:var(--mu)}

/* ---------- código Pix ---------- */
.code{background:#1a1a1a;border:1.5px dashed var(--ln);border-radius:12px;padding:14px;font-family:'Courier New',monospace;font-size:12px;word-break:break-all;margin:14px 0;color:var(--tx)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px;padding:10px 0}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.msg.user{align-self:flex-end;background:var(--p);color:#fff;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#4d4d4d;color:var(--tx);border-bottom-left-radius:4px}
.msg .who{display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:3px}

/* ---------- master ---------- */
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.stat .b{background:#2d2d2d;border-radius:12px;padding:14px;text-align:center}
.stat .b b{display:block;font-size:22px;font-weight:800;color:var(--p);margin-bottom:4px}
.stat .b span{font-size:11px;color:var(--mu);font-weight:700}

/* ---------- toast ---------- */
.toast{position:fixed;top:calc(20px + var(--top));left:50%;transform:translateX(-50%) translateY(-100px);background:#2d2d2d;color:var(--tx);padding:12px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:100;transition:transform .3s;max-width:calc(100% - 40px);border:1.5px solid var(--ln)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--gr);color:var(--gr)}
.toast.err{border-color:var(--rd);color:var(--rd)}

/* ---------- spinner ---------- */
.busy{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:200}
.busy i{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>

<script>
'use strict';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtBRL = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtDate = (d) => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const parseMoney = (s) => { const n = Number(String(s).replace(/\./g, '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };

const U = () => (S.st && S.st.user) || {};

/* ---------- ícones SVG ---------- */
const ICO = {
  home: '<path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/>',
  pix: '<path d="M9 5l-4 7 4 7M15 5l4 7-4 7"/>',
  card: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
  pig: '<path d="M19 8c-2-2-5-3-8-3s-6 1-8 3c-1 1-1 3 0 4 2 2 5 3 8 3s6-1 8-3c1-1 1-3 0-4z"/><circle cx="8" cy="11" r="1" fill="currentColor"/>',
  credit: '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
  bell: '<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 0c0 2-2.5 3-2.5 3M12 17h.01"/>',
  chevron: '<path d="M9 6l6 6-6 6"/>',
  arrow: '<path d="M5 12h14M12 5l7 7-7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  close: '<path d="M18 6L6 18M6 6l12 12"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  bonus: '<path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 17l-6.5 4 2-7.5L2 9h7z"/>',
  logout: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
  refresh: '<path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>',
};
const ico = (k) => `<svg class="i" viewBox="0 0 24 24">${ICO[k] || ''}</svg>`;

/* ---------- estado ---------- */
const S = {
  token: localStorage.getItem('armin_token') || '',
  st: null,
  master: null,
  page: 'home',
  authTab: 'login',
  socket: null,
  card: null,
  cardTimer: null,
  pix: { step: 1, key: '', rec: null, amount: '', value: 0, note: '' },
  toastTimer: null,
  sheetEl: null,
};

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.token) headers.authorization = `Bearer ${S.token}`;
  const r = await fetch(path, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : null });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || 'Erro na requisição');
  return j;
}
async function busy(el, fn) {
  if (el) el.disabled = true;
  const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = '<i></i>'; document.body.appendChild(b);
  try { return await fn(); } catch (e) { toast(e.message, 'err'); return null; } finally { document.body.removeChild(b); if (el) el.disabled = false; }
}
function toast(msg, type = '') {
  clearTimeout(S.toastTimer);
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.className = `toast show ${type}`; t.textContent = msg;
  S.toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);
}
function sheetOpen(html) {
  sheetClose();
  const s = document.createElement('div'); s.className = 'sheet open';
  s.innerHTML = `<div class="grip"></div><button class="close" data-act="closeSheet">${ico('close')}</button>${html}`;
  $('#root').appendChild(s); S.sheetEl = s;
  s.addEventListener('click', (e) => { if (e.target === s) sheetClose(); });
  return s;
}
function sheetClose() { if (S.sheetEl) { S.sheetEl.remove(); S.sheetEl = null; } }

/* ---------- renderização ---------- */
function shell() {
  return `<div class="app"><div id="view" class="view"></div><nav class="tabs" id="tabs"></nav><div id="sheetHost"></div></div>`;
}
function render() {
  if (!S.token || !S.st) { renderAuth(); return; }
  $('#root').innerHTML = shell();
  $('#tabs').innerHTML = tabsHtml();
  if (S.page === 'master' && U().role === 'admin') renderMaster();
  else renderHome();
}

function renderAuth() {
  const tab = S.authTab;
  $('#root').innerHTML = `
    <div class="auth">
      <div class="logo"><b>A</b> ARMIN BANK</div>
      <h1>Seu banco digital<br>sem complicação</h1>
      <p>Pix, cartão, cofrinho e crédito em um só lugar.</p>
      <div class="seg">
        <button class="${tab==='login'?'on':''}" data-act="switchAuth" data-tab="login">Entrar</button>
        <button class="${tab==='register'?'on':''}" data-act="switchAuth" data-tab="register">Criar conta</button>
      </div>
      ${tab === 'login' ? `
        <form data-form="login">
          <div class="fld"><label>Usuário ou e-mail</label><input name="username" required autocomplete="username"></div>
          <div class="fld"><label>Senha</label><input name="password" type="password" required autocomplete="current-password"></div>
          <button class="btn" type="submit">${ico('arrow')} Entrar</button>
        </form>
      ` : `
        <form data-form="register">
          <div class="fld"><label>Nome completo</label><input name="fullName" required placeholder="Seu Nome Sobrenome" autocomplete="name"></div>
          <div class="fld"><label>Usuário</label><input name="username" required pattern="[a-zA-Z0-9_]+" placeholder="seunome" autocomplete="username"><small>Apenas letras, números e underline</small></div>
          <div class="fld"><label>Senha</label><input name="password" type="password" required minlength="4" placeholder="Mínimo 4 caracteres" autocomplete="new-password"></div>
          <button class="btn" type="submit">${ico('check')} Criar minha conta</button>
        </form>
      `}
      <div class="demo">
        <p>Contas de demonstração:</p>
        <button data-act="demoLogin" data-u="aventureiro" data-p="1234">👤 Lia (user)</button>
        <button data-act="demoLogin" data-u="master" data-p="master">👑 Armin (admin)</button>
      </div>
    </div>
  `;
}

function tabsHtml() {
  const tabs = [
    { id: 'home', label: 'Início', icon: 'home' },
    { id: 'pix', label: 'Pix', icon: 'pix' },
    { id: 'card', label: 'Cartão', icon: 'card' },
    { id: 'more', label: 'Mais', icon: 'plus' },
  ];
  return tabs.map(t => `<button class="tab ${S.page===t.id?'on':''}" data-act="goPage" data-page="${t.id}">${ico(t.icon)}${t.label}</button>`).join('');
}

function renderHome() {
  const u = U();
  const txs = (S.st.transactions || []).slice(0, 8);
  const unread = (S.st.notifications || []).filter(n => !n.read).length;
  $('#view').innerHTML = `
    <div class="hdr tall">
      <div class="bar">
        <div class="av">${(u.fullName || u.username || '?')[0].toUpperCase()}</div>
        <div class="tools">
          <button class="ib" data-act="openNotifs">${ico('bell')}${unread ? `<span class="dot">${unread}</span>` : ''}</button>
          <button class="ib" data-act="openSupport">${ico('help')}</button>
          <button class="ib" data-act="logout">${ico('logout')}</button>
        </div>
      </div>
      <h1>Olá, ${(u.fullName || u.username).split(' ')[0]}</h1>
      <p>Saldo disponível</p>
    </div>
    <div class="wrap">
      <div class="card">
        <div class="big">${fmtBRL(u.balance)}</div>
        <div class="acts">
          <button class="act" data-act="openPix"><i>${ico('pix')}</i>Pix</button>
          <button class="act" data-act="openSavings"><i>${ico('pig')}</i>Cofrinho</button>
          <button class="act" data-act="openCard"><i>${ico('card')}</i>Cartão</button>
          <button class="act" data-act="openCredit"><i>${ico('credit')}</i>Crédito</button>
          <button class="act" data-act="bonus"><i>${ico('bonus')}</i>Bônus</button>
        </div>
      </div>
      ${u.savings > 0 ? `
        <div class="card">
          <div class="ttl"><h3>🐷 Cofrinho</h3><span class="pill g">rendendo</span></div>
          <div class="big">${fmtBRL(u.savings)}</div>
          <p class="mu sm-t">Rende ~1% ao mês</p>
        </div>
      ` : ''}
      <div class="card">
        <div class="ttl"><h3>Últimas transações</h3><button class="lnk" data-act="goPage" data-page="pix">Ver todas</button></div>
        ${txs.length ? txs.map(txRow).join('') : '<div class="empty"><b>Nenhuma transação</b>Suas movimentações aparecerão aqui.</div>'}
      </div>
    </div>
  `;
}

function renderMaster() {
  if (!S.master) { loadMaster(); return; }
  const m = S.master;
  $('#view').innerHTML = `
    <div class="hdr">
      <div class="bar"><button class="ib" data-act="goPage" data-page="home">${ico('arrow')}</button><div></div><button class="ib" data-act="refreshMaster">${ico('refresh')}</button></div>
      <h1>Painel Master 👑</h1>
      <p>Gerencie jogadores e crédito</p>
    </div>
    <div class="wrap">
      <div class="stat">
        <div class="b"><b>${m.metrics.players}</b><span>JOGADORES</span></div>
        <div class="b"><b>${m.metrics.pendingCredits}</b><span>CRÉDITOS PENDENTES</span></div>
        <div class="b"><b>${fmtBRL(m.metrics.moneyInPlay)}</b><span>EM JOGO</span></div>
        <div class="b"><b>${m.metrics.avgScore}</b><span>SCORE MÉDIO</span></div>
      </div>
      ${m.pending.length ? `
        <div class="card">
          <div class="ttl"><h3>Pedidos de crédito pendentes</h3></div>
          ${m.pending.map(r => `
            <div class="row">
              <div class="ic a">${ico('credit')}</div>
              <div class="mid"><b>${esc(r.fullName || r.username)}</b><span>${esc(r.purpose)} • ${fmtBRL(r.amount)}</span></div>
              <div class="end">
                <button class="btn sm" style="background:var(--gr);color:#fff;margin-bottom:4px" data-act="decide" data-id="${r.id}" data-d="approve">Aprovar</button>
                <button class="btn sm dng" data-act="decide" data-id="${r.id}" data-d="reject">Reprovar</button>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div class="card">
        <div class="ttl"><h3>Jogadores (${m.users.length})</h3></div>
        ${m.users.map(u => `
          <div class="row">
            <div class="av">${(u.fullName || u.username)[0].toUpperCase()}</div>
            <div class="mid"><b>${esc(u.fullName)}</b><span>@${esc(u.username)} • Score ${u.score}</span></div>
            <div class="end">${fmtBRL(u.balance)}<small>${u.locked ? '🔒 bloqueado' : ''}</small></div>
          </div>
        `).join('')}
      </div>
      ${m.support && m.support.length ? `
        <div class="card">
          <div class="ttl"><h3>Suporte recente</h3></div>
          ${m.support.slice(0,5).map(msg => `
            <div class="row" data-act="thread" data-id="${msg.userId}">
              <div class="ic">${ico('help')}</div>
              <div class="mid"><b>${esc(msg.author || 'Jogador')}</b><span>${esc(msg.text.slice(0,50))}</span></div>
              <div class="end">${fmtDate(msg.createdAt)}${ico('chevron')}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

function txRow(tx) {
  const isIn = tx.kind === 'pix_in' || tx.kind === 'savings_yield' || tx.kind === 'deposit' || tx.type === 'in';
  const icon = tx.kind === 'pix_in' || tx.kind === 'pix_out' ? 'pix' : tx.kind === 'card' ? 'card' : tx.kind === 'savings' ? 'pig' : tx.kind === 'credit' ? 'credit' : 'arrow';
  const title = tx.description || tx.title || (isIn ? 'Recebido' : 'Enviado');
  const cls = isIn ? 'in' : 'out';
  const val = isIn ? `+${fmtBRL(Math.abs(tx.amount))}` : `-${fmtBRL(Math.abs(tx.amount))}`;
  return `<div class="row"><div class="ic ${isIn?'g':'r'}">${ico(icon)}</div><div class="mid"><b>${esc(title)}</b><span>${fmtDate(tx.createdAt)}</span></div><div class="end ${cls}">${val}</div></div>`;
}

/* ---------- ações ---------- */
const A = {
  switchAuth: (el) => { S.authTab = el.dataset.tab; render(); },
  goPage: (el) => { S.page = el.dataset.page; render(); },
  demoLogin: async (el) => { const r = await busy(el, () => api('/api/login', { method: 'POST', body: { username: el.dataset.u, password: el.dataset.p } })); if (r) { enter(r); } },
  logout: () => doLocalLogout(),
  openPix: () => { S.pix = { step: 1, key: '', rec: null, amount: '', value: 0, note: '' }; pixStep1(); },
  openSavings: () => openSavings(),
  openCard: () => openCard(),
  openCredit: () => openCreditReq(),
  bonus: async (el) => { const r = await busy(el, () => api('/api/bonus', { method: 'POST' })); if (r) { setState(r); toast(`Você ganhou ${fmtBRL(r.reward)} de bônus!`, 'ok'); } },
  cardToggle: async (el) => { const r = await busy(el, () => api('/api/card/toggle', { method: 'POST' })); if (r) { setState(r); toast(U().cardBlocked ? 'Cartão bloqueado.' : 'Cartão desbloqueado.', 'ok'); } },
  cardReveal: async (el) => {
    if (S.card) { S.card = null; clearTimeout(S.cardTimer); return render(); }
    const r = await busy(el, () => api('/api/card/secret')); if (!r) return;
    S.card = r.card; render(); clearTimeout(S.cardTimer); S.cardTimer = setTimeout(() => { S.card = null; render(); }, 20000);
  },
  decide: async (el) => { const r = await busy(el, () => api(`/api/master/credit/${encodeURIComponent(el.dataset.id)}/${el.dataset.d}`, { method: 'POST', body: {} })); if (r) { toast(el.dataset.d === 'approve' ? 'Crédito aprovado.' : 'Análise reprovada.', 'ok'); loadMaster(); } },
  thread: (el) => openThread(el.dataset.id),
  deposit: (el) => openDeposit(el.dataset.id),
  refreshMaster: () => loadMaster(),
  openNotifs: () => openNotifs(),
  openSupport: () => openSupportChat(),
  closeSheet: () => sheetClose(),
};
async function pasteInto() {
  try { const t = await navigator.clipboard.readText(); const i = $('#pk'); if (i && t) { i.value = t.trim(); toast('Colado!', 'ok'); } else toast('Nada para colar.'); }
  catch { toast('Seu navegador bloqueou a área de transferência. Cole manualmente no campo.'); $('#pk') && $('#pk').focus(); }
}
async function lookupAndGo(raw) {
  let key = String(raw || '').trim(), amount = '';
  if (key.startsWith('ZKPIX|')) { const [, k, a] = key.split('|'); key = k; if (a && Number(a) > 0) amount = String(a).replace('.', ','); }
  const r = await busy($('#sheetBody button[type=submit]'), () => api('/api/pix/lookup', { method: 'POST', body: { key } }));
  if (!r) { if (!sheetOpen()) pixStep1(); return; }
  S.pix = { ...S.pix, key, rec: r.recipient, amount }; pixStep2();
}
const CH = { keyType: (el) => { $('#kvWrap').classList.toggle('hidden', el.value === 'aleatória'); const k = $('#kv'); if (k) { k.required = el.value !== 'aleatória'; k.placeholder = { email: 'voce@email.com', telefone: '(11) 91234-5678', cpf: '000.000.000-00' }[el.value] || ''; } } };

/* ---------- formulários ---------- */
const F = {
  login: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); await busy(ev.submitter, () => doLogin(d.username, d.password)); },
  register: async (f, ev) => {
    const d = Object.fromEntries(new FormData(f));
    const r = await busy(ev.submitter, () => api('/api/register', { method: 'POST', body: d })); if (r) { enter(r); toast('Conta criada! Bem-vindo(a).', 'ok'); }
  },
  pixLookup: (f) => lookupAndGo(new FormData(f).get('key')),
  pixReview: (f) => {
    const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount);
    if (!(v > 0)) return toast('Digite um valor válido.', 'err');
    if (v > U().balance) return toast('Saldo insuficiente para este Pix.', 'err');
    S.pix.value = v; S.pix.amount = d.amount; S.pix.note = (d.note || '').trim(); pixStep3();
  },
  addKey: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/pix/key', { method: 'POST', body: d })); if (r) { setState(r); toast('Chave cadastrada!', 'ok'); } },
  charge: (f) => {
    const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); const hasV = d.amount.trim() !== '';
    if (hasV && !(v > 0)) return toast('Valor inválido.', 'err');
    const code = `ZKPIX|${d.key}|${hasV ? v.toFixed(2) : '0'}`;
    $('#chargeOut').innerHTML = `<div class="code">${esc(code)}</div><div class="btns"><button class="btn" data-act="copyCode" data-v="${esc(code)}">${ico('copy')} Copiar código</button></div><p class="mu sm-t">Envie este código. Quem for pagar cola em <b>Pix → Pagar com código</b>.</p>`;
  },
  savings: async (f, ev) => {
    const v = parseMoney(new FormData(f).get('amount')); if (!(v > 0)) return toast('Digite um valor válido.', 'err');
    const dir = (ev.submitter && ev.submitter.dataset.dir) || 'in';
    const r = await busy(ev.submitter, () => api(`/api/savings/${dir}`, { method: 'POST', body: { amount: v } }));
    if (r) { setState(r); openSavings(); toast(dir === 'in' ? 'Guardado com sucesso!' : 'Resgate feito — dinheiro na conta.', 'ok'); }
  },
  invoice: async (f, ev) => { const v = parseMoney(new FormData(f).get('amount')); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/credit/pay', { method: 'POST', body: { amount: v } })); if (r) { setState(r); sheetClose(); toast('Fatura paga!', 'ok'); } },
  draw: async (f, ev) => { const v = parseMoney(new FormData(f).get('amount')); if (!(v >= 10)) return toast('O valor mínimo é R$ 10,00.', 'err'); const r = await busy(ev.submitter, () => api('/api/credit/draw', { method: 'POST', body: { amount: v } })); if (r) { setState(r); sheetClose(); toast(`${fmtBRL(v)} na sua conta!`, 'ok'); } },
  purchase: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/card/purchase', { method: 'POST', body: { merchant: d.merchant, amount: v } })); if (r) { setState(r); sheetClose(); toast('Compra aprovada!', 'ok'); } },
  creditReq: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v >= 100)) return toast('Peça pelo menos R$ 100,00.', 'err'); const r = await busy(ev.submitter, () => api('/api/credit/request', { method: 'POST', body: { amount: v, purpose: d.purpose } })); if (r) { setState(r); openCreditReq(); toast(r.message, 'ok'); } },
  password: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const r = await busy(ev.submitter, () => api('/api/password', { method: 'POST', body: d })); if (r) { S.token = r.token; localStorage.setItem('armin_token', r.token); connectSocket(); setState(r); sheetClose(); toast('Senha alterada!', 'ok'); } },
  support: async (f, ev) => {
    const text = new FormData(f).get('text') ?? $('#chatIn').value; const t = String(text).trim(); if (!t) return;
    const r = await busy(ev.submitter, () => api('/api/support/messages', { method: 'POST', body: { text: t } })); if (r) { $('#chatIn').value = ''; setState(r); }
  },
  reply: async (f, ev) => {
    const d = Object.fromEntries(new FormData(f)); if (!String(d.text).trim()) return;
    const r = await busy(ev.submitter, () => api('/api/master/support/reply', { method: 'POST', body: d })); if (r) { await loadMaster(); openThread(d.userId, true); }
  },
  deposit: async (f, ev) => { const d = Object.fromEntries(new FormData(f)); const v = parseMoney(d.amount); if (!(v > 0)) return toast('Digite um valor válido.', 'err'); const r = await busy(ev.submitter, () => api('/api/master/deposit', { method: 'POST', body: { userId: d.userId, amount: v, note: d.note } })); if (r) { sheetClose(); toast('Depósito feito.', 'ok'); loadMaster(); } },
};

/* ====== sessão e tempo real ====== */
async function doLogin(username, password) { const r = await api('/api/login', { method: 'POST', body: { username, password } }); enter(r); toast(`Olá, ${r.state.user.fullName.split(' ')[0]}!`, 'ok'); }
function enter(r) { S.token = r.token; localStorage.setItem('armin_token', S.token); S.st = r.state; S.page = 'home'; S.master = null; render(); connectSocket(); }
function doLocalLogout() {
  localStorage.removeItem('armin_token'); S.token = ''; S.st = null; S.master = null; S.card = null; S.page = 'home'; S.authTab = 'login';
  if (S.socket) { S.socket.disconnect(); S.socket = null; } sheetClose(); render();
}
function connectSocket() {
  if (S.socket) { S.socket.disconnect(); S.socket = null; }
  if (typeof io === 'undefined' || !S.token) return;
  S.socket = io({ auth: { token: S.token }, reconnectionDelayMax: 8000 });
  S.socket.on('account:updated', (p) => { if (p.state) { S.st = p.state; render(); } });
  S.socket.on('master:refresh', () => { if (S.page === 'master') loadMaster(); });
}
async function poll() { if (!S.token || !S.st || document.hidden) return; try { const r = await api('/api/me'); if (JSON.stringify(r.state) !== JSON.stringify(S.st)) { S.st = r.state; render(); } } catch {} }

/* ========= eventos globais ========= */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) { console.warn('Ação sem handler:', el.dataset.act); return; }
  e.preventDefault(); fn(el, e);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const fn = F[f.dataset.form]; if (fn) fn(f, e); else console.warn('Form sem handler:', f.dataset.form);
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CH[el.dataset.change]) CH[el.dataset.change](el); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetOpen()) sheetClose(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
setInterval(poll, 25000);

/* ========= boot ========= */
$('#root').innerHTML = shell();
(async function boot() {
  render();
  if (!S.token) return;
  try { const r = await api('/api/me'); S.st = r.state; render(); connectSocket(); }
  catch (e) { if (S.token) { /* erro de rede: mantém token, mostra login */ } render(); }
})();
</script>
</body>
</html>
