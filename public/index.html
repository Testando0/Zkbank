<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Bank | System</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* CSS OTIMIZADO PARA MOBILE E DESKTOP */
        :root { --bg: #050505; --panel: #0a0a0f; --primary: #8a2be2; --accent: #00ff41; --text: #fff; --gray: #888; --border: #1f1f2e; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Layout */
        #app { display: none; height: 100vh; flex-direction: column; }
        #login-screen { display: flex; height: 100vh; justify-content: center; align-items: center; background: radial-gradient(circle, #1a0b2e 0%, #000 100%); }
        
        /* Componentes */
        .box { background: var(--panel); border: 1px solid var(--primary); padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(138,43,226,0.2); text-align: center; }
        input, select { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; margin-bottom: 10px; border-radius: 5px; font-size: 16px; }
        button { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 5px; }
        button:active { transform: scale(0.98); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); }
        .btn-green { background: var(--accent); color: #000; }
        .btn-red { background: #ff3333; }

        /* Header & Nav */
        header { background: var(--panel); padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .nav-bar { display: flex; overflow-x: auto; background: var(--panel); padding: 10px; gap: 10px; border-bottom: 1px solid var(--border); }
        .nav-item { padding: 8px 15px; border: 1px solid var(--border); border-radius: 20px; white-space: nowrap; font-size: 0.9em; cursor: pointer; }
        .nav-item.active { background: var(--primary); border-color: var(--primary); }

        /* Conteúdo */
        .content { padding: 20px; flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .card { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        
        /* Loja Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .product { background: #111; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; position: relative; }
        .product img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; }
        .badge { position: absolute; top: 5px; right: 5px; font-size: 10px; padding: 2px 5px; border-radius: 4px; }
        .r-lendario { background: gold; color: #000; box-shadow: 0 0 5px gold; }
        .r-raro { background: #007bff; color: #fff; }
        .r-comum { background: #555; color: #fff; }

        /* Admin */
        .admin-panel { border: 1px solid var(--accent); padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        .req-item { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; margin-bottom: 5px; border-radius: 5px; }

        .hidden { display: none !important; }        .money { color: var(--accent); font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="box">
            <h1 style="color:var(--primary); text-shadow: 0 0 10px var(--primary);">GHOST BANK</h1>
            <p style="font-size: 12px; color: #666;">SISTEMA SEGURO v2.0</p>
            <input type="text" id="l-user" placeholder="Usuário">
            <input type="password" id="l-pass" placeholder="Senha">
            <button onclick="doLogin()">ENTRAR</button>
            <button class="btn-outline" onclick="toggleReg()" style="margin-top:10px">CRIAR CONTA</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app">
        <header>
            <div style="font-weight:bold; color:var(--primary)">GHOST BANK</div>
            <div id="user-info" style="font-size:12px; color:var(--accent)"></div>
        </header>
        
        <div class="nav-bar">
            <div class="nav-item active" onclick="nav('dash')">Dashboard</div>
            <div class="nav-item" onclick="nav('store')">Loja</div>
            <div class="nav-item" onclick="nav('wallet')">Carteira</div>
            <div class="nav-item hidden" id="nav-admin" onclick="nav('admin')">OWNER</div>
            <div class="nav-item" style="border-color:red; color:red" onclick="logout()">Sair</div>
        </div>

        <div class="content">
            <!-- DASHBOARD -->
            <div id="view-dash">
                <div class="card" style="text-align:center; padding: 30px;">
                    <div style="color:#888">SALDO TOTAL</div>
                    <h1 style="font-size: 2.5em; margin: 10px 0;">R$ <span id="d-balance">0,00</span></h1>
                    <div style="color:#888">GHOST COINS</div>
                    <h2 class="money"><span id="d-coins">0</span> GC</h2>
                </div>
                <button class="btn-green" onclick="getAirdrop()">🎁 RESGATAR AIRDROP DIÁRIO</button>
            </div>

            <!-- LOJA -->
            <div id="view-store" class="hidden">
                <h3>LOJA GHOST</h3>
                <div id="store-grid" class="grid"></div>
            </div>
            <!-- CARTEIRA -->
            <div id="view-wallet" class="hidden">
                <div class="card">
                    <h3>Resgatar Código</h3>
                    <input type="text" id="code-input" placeholder="GHOST-XXXXXX">
                    <button onclick="redeemCode()">RESGATAR</button>
                </div>
                <div class="card">
                    <h3>Solicitar Crédito</h3>
                    <input type="number" id="req-amount" placeholder="Quantidade de Coins">
                    <button class="btn-outline" onclick="sendRequest()">SOLICITAR AO MASTER</button>
                </div>
            </div>

            <!-- ADMIN -->
            <div id="view-admin" class="hidden">
                <h2 style="color:var(--accent)">PAINEL OWNER</h2>
                
                <div class="admin-panel">
                    <h4>Adicionar Produto</h4>
                    <input type="text" id="p-name" placeholder="Nome">
                    <input type="number" id="p-price" placeholder="Preço (Coins)">
                    <select id="p-rarity"><option value="comum">Comum</option><option value="raro">Raro</option><option value="lendario">Lendário</option></select>
                    <input type="text" id="p-img" placeholder="Link da Imagem (Telegraph/Imgur)">
                    <button class="btn-green" onclick="addProduct()">PUBLICAR</button>
                </div>

                <div class="admin-panel">
                    <h4>Gerar Código</h4>
                    <input type="number" id="c-val" placeholder="Valor">
                    <button onclick="genCode()">GERAR</button>
                    <p id="gen-result" style="color:var(--accent); font-weight:bold; margin-top:5px"></p>
                </div>

                <h4>Solicitações Pendentes</h4>
                <div id="req-list"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let me = JSON.parse(localStorage.getItem('ghost_user'));
        let products = [];

        // Inicialização
        if (me) initApp();

        // Socket Listeners
        socket.on('update_all', (data) => {            products = data.products;
            renderStore();
        });
        socket.on('init_data', (data) => {
            products = data.products;
            renderStore();
        });

        // --- AUTH ---
        function toggleReg() {
            const isReg = document.querySelector('button[onclick="doRegister()"]');
            if(isReg) {
                document.querySelector('button[onclick="doRegister()"]').outerHTML = '<button onclick="doLogin()">ENTRAR</button><button class="btn-outline" onclick="toggleReg()" style="margin-top:10px">CRIAR CONTA</button>';
            } else {
                document.querySelector('button[onclick="doLogin()"]').outerHTML = '<button onclick="doRegister()">REGISTRAR</button><button class="btn-outline" onclick="toggleReg()" style="margin-top:10px">VOLTAR</button>';
            }
        }

        async function doLogin() {
            const u = document.getElementById('l-user').value;
            const p = document.getElementById('l-pass').value;
            const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
            const data = await res.json();
            if(data.success) {
                me = data.user;
                localStorage.setItem('ghost_user', JSON.stringify(me));
                initApp();
            } else alert(data.message);
        }

        async function doRegister() {
            const u = document.getElementById('l-user').value;
            const p = document.getElementById('l-pass').value;
            const res = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
            const data = await res.json();
            if(data.success) { alert('Conta criada! Faça login.'); toggleReg(); }
            else alert(data.message);
        }

        function logout() {
            localStorage.removeItem('ghost_user');
            location.reload();
        }

        function initApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            document.getElementById('user-info').innerText = me.username + (me.role==='admin'?' [MASTER]':'');
            updateDash();
            if(me.role === 'admin') {                document.getElementById('nav-admin').classList.remove('hidden');
                loadAdmin();
            }
            nav('dash');
        }

        function updateDash() {
            document.getElementById('d-balance').innerText = me.balance.toFixed(2);
            document.getElementById('d-coins').innerText = me.coins;
        }

        function nav(view) {
            document.querySelectorAll('.content > div').forEach(d => d.classList.add('hidden'));
            document.getElementById('view-'+view).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            // Simples highlight logic
        }

        // --- LOJA ---
        function renderStore() {
            const grid = document.getElementById('store-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product">
                        <span class="badge r-${p.rarity}">${p.rarity}</span>
                        <img src="${p.image}" onerror="this.src='https://via.placeholder.com/80?text=IMG'">
                        <div style="font-weight:bold; font-size:14px; margin-bottom:5px">${p.name}</div>
                        <div class="money" style="font-size:14px">${p.price} GC</div>
                        <button style="padding:5px; font-size:12px; margin-top:5px" onclick="buy(${p.id})">COMPRAR</button>
                    </div>
                `;
            });
        }

        async function buy(id) {
            const res = await fetch('/api/buy', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({userId: me.id, productId: id}) });
            const data = await res.json();
            if(data.success) {
                me.coins = data.newBalance;
                localStorage.setItem('ghost_user', JSON.stringify(me));
                updateDash();
                alert('Comprado: ' + data.item);
            } else alert(data.message);
        }

        // --- CARTEIRA ---
        async function getAirdrop() {
            const res = await fetch('/api/airdrop', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({userId: me.id}) });
            const data = await res.json();            if(data.success) {
                me.coins = data.newBalance;
                localStorage.setItem('ghost_user', JSON.stringify(me));
                updateDash();
                alert('Airdrop: +' + data.reward + ' GC');
            } else alert(data.message);
        }

        async function redeemCode() {
            const code = document.getElementById('code-input').value;
            const res = await fetch('/api/redeem', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({userId: me.id, code}) });
            const data = await res.json();
            if(data.success) {
                me.coins = data.newBalance;
                localStorage.setItem('ghost_user', JSON.stringify(me));
                updateDash();
                alert('Sucesso!');
            } else alert(data.message);
        }

        async function sendRequest() {
            const amount = document.getElementById('req-amount').value;
            await fetch('/api/request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({userId: me.id, username: me.username, amount}) });
            alert('Solicitado!');
        }

        // --- ADMIN ---
        async function loadAdmin() {
            const res = await fetch('/api/admin/requests');
            const reqs = await res.json();
            const list = document.getElementById('req-list');
            list.innerHTML = '';
            reqs.forEach(r => {
                list.innerHTML += `
                    <div class="req-item">
                        <span>${r.username} pede ${r.amount}</span>
                        <div>
                            <button class="btn-green" style="width:auto; padding:5px" onclick="handleReq(${r.id}, 'approve')">OK</button>
                            <button class="btn-red" style="width:auto; padding:5px" onclick="handleReq(${r.id}, 'deny')">X</button>
                        </div>
                    </div>
                `;
            });
        }

        async function addProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const rarity = document.getElementById('p-rarity').value;
            const image = document.getElementById('p-img').value;            await fetch('/api/admin/product', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, price, rarity, image}) });
            alert('Produto no ar!');
            loadAdmin();
        }

        async function genCode() {
            const val = document.getElementById('c-val').value;
            const res = await fetch('/api/admin/code', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({value: val}) });
            const data = await res.json();
            document.getElementById('gen-result').innerText = data.code;
        }

        async function handleReq(id, action) {
            await fetch('/api/admin/request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({reqId: id, action}) });
            loadAdmin();
        }
    </script>
</body>
                                                           </html>
